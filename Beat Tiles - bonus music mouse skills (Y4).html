<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Tiles! - Year 4 Computing Game</title>
<style>
  :root{ --c1:#F472B6; --c2:#FBBF24; --click:#38BDF8; --dbl:#F472B6; --rgt:#34D399; --hold:#FBBF24; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body.bt{font-family:'Segoe UI',Calibri,Arial,sans-serif;background:radial-gradient(circle at 30% 20%,#3b1d7a 0%,#150a35 60%,#0a0420 100%)!important;color:#fff;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 12px;user-select:none;-webkit-user-select:none;overflow-x:hidden;}
  .bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bokeh i{position:absolute;border-radius:50%;opacity:.18;animation:bk linear infinite;}
  @keyframes bk{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
  .top{position:relative;z-index:2;width:100%;max-width:560px;text-align:center;}
  h1{margin:0;font-size:clamp(22px,3.4vw,30px);background:linear-gradient(90deg,#38BDF8,#F472B6,#FBBF24);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;padding:8px 14px;background:rgba(255,255,255,.1);border-radius:14px;font-weight:700;font-size:15px;}
  .hud .big{font-size:20px;color:#FBBF24;}
  .prog{height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#38BDF8,#F472B6);transition:width .2s;}
  .legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px;font-size:12.5px;font-weight:700;}
  .chip{padding:3px 10px;border-radius:12px;color:#10122b;}
  .field{position:relative;z-index:2;width:100%;max-width:520px;height:clamp(380px,calc(100vh - 215px),640px);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.12));border:3px solid rgba(255,255,255,.35);box-shadow:0 0 30px rgba(168,85,247,.5);touch-action:none;cursor:pointer;}
  .field.pulse{box-shadow:0 0 46px rgba(244,114,182,.85);}
  .lane{position:absolute;top:0;bottom:0;width:25%;border-right:2px solid rgba(255,255,255,.12);}
  .hitline{position:absolute;left:0;right:0;height:5px;background:linear-gradient(90deg,#38BDF8,#F472B6,#FBBF24);box-shadow:0 0 16px #fff;pointer-events:none;opacity:.9;}
  .tile{position:absolute;top:0;padding:3px;will-change:transform;cursor:pointer;}
  .tile .in{position:relative;width:100%;height:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:900;color:#10122b;font-size:clamp(14px,2.4vw,20px);line-height:1.1;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 0 14px rgba(255,255,255,.35);overflow:hidden;}
  .tile .in small{font-size:.62em;font-weight:800;opacity:.8;letter-spacing:.5px;}
  .tile.click .in{background:linear-gradient(#7DD3FC,var(--click));}
  .tile.dbl .in{background:linear-gradient(#F9A8D4,var(--dbl));}
  .tile.rgt .in{background:linear-gradient(#6EE7B7,var(--rgt));}
  .tile.hold .in{background:linear-gradient(#FDE68A,var(--hold));}
  .tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,255,255,.7);}
  .tile.half .in{filter:brightness(1.15);animation:half .3s ease-in-out infinite alternate;}
  @keyframes half{to{transform:scale(.94)}}
  .tile.done{pointer-events:none;}
  .tile.done .in{background:linear-gradient(#fff,#d1fae5);color:#047857;box-shadow:0 0 20px #fff;opacity:.55;transition:opacity .5s;}
  .tile.miss{pointer-events:none;}
  .tile.miss .in{background:#475569;color:#cbd5e1;box-shadow:none;opacity:.5;}
  .tile.shake .in{animation:shk .25s;}
  @keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,16vw,130px);font-weight:900;pointer-events:none;
    text-shadow:0 0 30px #F472B6;z-index:5;}
  .hint{position:absolute;left:8px;right:8px;top:8px;text-align:center;background:rgba(0,0,0,.6);border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s;}
  .hint.show{opacity:1;}
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(10,4,32,.88);display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:linear-gradient(160deg,#2b1668,#4c1d95);border:3px solid rgba(255,255,255,.4);border-radius:24px;padding:24px 28px;max-width:540px;width:100%;text-align:center;box-shadow:0 0 50px rgba(168,85,247,.6);}
  .card h2{margin:0 0 6px;font-size:clamp(24px,4vw,32px);}
  .card p{margin:6px 0;font-size:16px;line-height:1.4;color:#e9d5ff;}
  .card input{width:100%;padding:12px;border-radius:12px;border:none;font-size:18px;text-align:center;margin:8px 0;}
  .btn{background:linear-gradient(135deg,#F472B6,#FBBF24);color:#2a0a4a;border:none;border-radius:16px;padding:12px 28px;font-size:20px;font-weight:900;cursor:pointer;margin-top:10px;box-shadow:0 5px 0 rgba(0,0,0,.3);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .skills{display:flex;flex-direction:column;gap:8px;margin:12px 0;text-align:left;}
  .skill{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;}
  .skill .sw{min-width:64px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#10122b;font-weight:900;font-size:14px;}
  .err{color:#fca5a5;font-weight:700;min-height:20px;}
  .vol{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;margin-top:4px;}
  .vol input{width:110px;margin:0;padding:0;}
  table.sum{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;}
  table.sum td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.2);}
  .badge{position:fixed;top:10px;right:12px;z-index:50;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:14px;font-weight:800;font-size:14px;}
</style>
<script src="fx.js"></script>
</head>
<body class="bt">
<div class="bokeh" id="bokeh"></div>
<div class="badge" id="badge" style="display:none"></div>

<div class="overlay" id="gate"><div class="card">
  <h2>🎧 Beat Tiles!</h2>
  <p><b>Put on your headphones</b> and make music with your mouse! Tiles fall down — click them at the right time to play the song.</p>
  <p style="font-size:14px">Keep your volume low and comfy 🔉</p>
  <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
  <div class="err" id="nameErr"></div>
  <button class="btn" id="startBtn">Let's play ▶</button>
</div></div>

<div class="overlay" id="intro" style="display:none"><div class="card">
  <div style="font-size:60px" id="iEmoji">🎵</div>
  <h2 id="iTitle">Song</h2>
  <p id="iSub"></p>
  <div class="skills" id="iSkills"></div>
  <button class="btn" id="goBtn">Start song ▶</button>
</div></div>

<div class="top">
  <h1><span style="-webkit-text-fill-color:initial">🎹</span> Beat Tiles!</h1>
  <div class="hud"><div>🎵 <span id="songName">—</span></div><div>⭐ <span class="big" id="pts">0</span></div><div>🔥 <span class="big" id="combo">0</span></div></div>
  <div class="prog"><b id="progBar"></b></div>
  <div class="legend" id="legend"></div>
</div>
<div class="field" id="field" oncontextmenu="return false">
  <div class="lane" style="left:0"></div><div class="lane" style="left:25%"></div><div class="lane" style="left:50%"></div><div class="lane" style="left:75%;border-right:none"></div>
  <div class="hitline" id="hitline"></div>
  <div class="hint" id="hint"></div>
  <div class="count" id="count"></div>
</div>
<div class="vol top" style="position:relative;z-index:2">🔈 <input type="range" id="vol" min="0" max="100" value="55"> 🔊</div>

<script>
const YEAR = 4;
const GAME_LABEL = "Beat Tiles! (Y4)";
const TYPES = {
  c:{cls:'click',label:'👆',sub:'CLICK',name:'Click',desc:'Click the tile once',col:'#38BDF8'},
  d:{cls:'dbl',label:'✌️',sub:'DOUBLE',name:'Double-click',desc:'Click twice, fast!',col:'#F472B6'},
  r:{cls:'rgt',label:'R',sub:'RIGHT-CLICK',name:'Right-click',desc:'Use the RIGHT mouse button',col:'#34D399'},
  h:{cls:'hold',label:'⏳',sub:'HOLD',name:'Click and hold',desc:'Press down and keep holding until it fills up',col:'#FBBF24'}
};
const SONGS = [{"name": "Mary Had a Little Lamb", "emoji": "🐑", "bpm": 104, "bass": 65.41, "tip": "Warm-up with clicks and double-clicks.", "tiles": "E4 D4 C4 D4 E4 E4 E4:2d D4 D4 D4:2d E4 G4 G4:2d E4 D4 C4 D4 E4 E4 E4 E4 D4 D4 E4 D4 C4:4d"}, {"name": "Frere Jacques", "emoji": "🥖", "bpm": 100, "bass": 65.41, "tip": "New skill: RIGHT-click the green tiles! (Use your right mouse button.)", "tiles": "C4 D4 E4 C4 C4:1r D4:1r E4:1r C4:1r E4 F4 G4:2d E4:1r F4:1r G4:2r G4 A4 G4 F4 E4 C4 G4:1r A4:1r G4:1r F4:1r E4:1r C4:1r C4 G3 C4:2d C4:1r G3:1r C4:2r"}, {"name": "Fur Elise", "emoji": "🎹", "bpm": 96, "bass": 110.0, "tip": "Boss song! Click, double-click, right-click AND hold!", "tiles": "E5 D#5 E5 D#5 E5 B4 D5 C5 A4:3h C4 E4 A4 B4:2d E4 G#4 B4 C5:3h E4 E5:1r D#5:1r E5:1r D#5:1r E5:1r B4:1r D5:1r C5:1r A4:3h C4 E4 A4 B4:2d E4 C5 B4 A4:4h"}];
const SEMI = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function freq(n){ const m = /^([A-G]#?)(\d)$/.exec(n); const s = SEMI[m[1]] + (parseInt(m[2])+1)*12; return 440*Math.pow(2,(s-69)/12); }
function parse(str){
  return str.trim().split(/\s+/).map(tok=>{
    const m = /^([A-G]#?\d)(?::([\d.]+))?([cdrh])?$/.exec(tok);
    if(!m) throw new Error('bad token '+tok);
    return {note:m[1], beats:parseFloat(m[2]||'1'), type:m[3]||'c'};
  });
}

/* ===== bokeh background ===== */
(function(){ const b=document.getElementById('bokeh'); const cols=['#38BDF8','#F472B6','#FBBF24','#34D399','#A78BFA'];
  for(let i=0;i<14;i++){ const e=document.createElement('i'); const s=30+Math.random()*90; e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[i%5]};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`; b.appendChild(e);} })();

/* ===== audio ===== */
let AC=null, master=null, noiseBuf=null;
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  const len = AC.sampleRate*0.3; noiseBuf = AC.createBuffer(1,len,AC.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  setVol();
}
function setVol(){ if(master) master.gain.value = Math.pow(document.getElementById('vol').value/100,1.5)*0.9; }
document.getElementById('vol').addEventListener('input', setVol);
function startNote(f, hold){
  if(!AC) return {release(){}};
  const t=AC.currentTime, g=AC.createGain(), o1=AC.createOscillator(), o2=AC.createOscillator(), g2=AC.createGain();
  o1.type='triangle'; o1.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=0.3;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7,t+0.01);
  if(hold){ g.gain.exponentialRampToValueAtTime(0.35,t+0.25); }
  else { g.gain.exponentialRampToValueAtTime(0.0001,t+1.3); }
  o1.start(t); o2.start(t); if(!hold){ o1.stop(t+1.4); o2.stop(t+1.4); }
  return { release(){ const n=AC.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,0.0001),n); g.gain.exponentialRampToValueAtTime(0.0001,n+0.25); try{o1.stop(n+0.3);o2.stop(n+0.3);}catch(e){} } };
}
function kick(t,v){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2); }
function hat(t,v,hp){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||7000; const g=AC.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.1); }
function snare(t,v){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; const g=AC.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.2); }
function bass(t,fr,d,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=fr; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.05); }

/* ===== game state ===== */
const field = document.getElementById('field');
let studentName='', songIdx=0, S=null, tiles=[], t0=0, rafId=0, schedId=0, nextBeat=0, beatSec=0, pxBeat=0, speed=0, hitY=0, fieldH=0, lastBeatShown=-1, running=false;
let points=0, combo=0, bestCombo=0, totalTiles=0, totalHit=0; const songRes=[];
let songPts=0, songHit=0, songMiss=0;
const els = id=>document.getElementById(id);

function buildLegend(){
  const used = new Set(); SONGS.forEach(s=>parse(s.tiles).forEach(n=>used.add(n.type)));
  els('legend').innerHTML = ['c','d','r','h'].filter(k=>used.has(k)).map(k=>`<span class="chip" style="background:${TYPES[k].col}">${TYPES[k].label} ${TYPES[k].name}</span>`).join('');
}
function showIntro(){
  const s = SONGS[songIdx], ns = parse(s.tiles), used=[...new Set(ns.map(n=>n.type))];
  els('iEmoji').textContent = s.emoji; els('iTitle').textContent = `Song ${songIdx+1}: ${s.name}`;
  els('iSub').textContent = s.tip;
  els('iSkills').innerHTML = ['c','d','r','h'].filter(k=>used.includes(k)).map(k=>`<div class="skill"><div class="sw" style="background:${TYPES[k].col}">${TYPES[k].label} ${TYPES[k].sub}</div><div>${TYPES[k].desc}</div></div>`).join('');
  els('intro').style.display='flex';
}
function layout(){
  S = SONGS[songIdx]; const notes = parse(S.tiles);
  field.querySelectorAll('.tile').forEach(e=>e.remove()); tiles=[];
  fieldH = field.clientHeight; hitY = fieldH*0.76; pxBeat = fieldH*0.2; beatSec = 60/S.bpm; speed = pxBeat/beatSec;
  let beat=5, lane=Math.floor(Math.random()*4), seed=songIdx*7+YEAR;
  notes.forEach((n,i)=>{
    let nl; do{ seed=(seed*9301+49297)%233280; nl=Math.floor(seed/233280*4); }while(nl===lane && (i%3!==0));
    lane=nl;
    let h = Math.max(n.beats, n.type==='h'?2.2:0.9)*pxBeat;
    const el=document.createElement('div'); el.className='tile '+TYPES[n.type].cls; el.style.width='25%'; el.style.left=(lane*25)+'%'; el.style.height=h+'px';
    el.innerHTML = `<div class="in"><span>${TYPES[n.type].label}</span><small>${TYPES[n.type].sub}</small>${n.type==='h'?'<div class="fill"></div>':''}</div>`;
    field.appendChild(el);
    const o={el,note:n.note,type:n.type,T:beat*beatSec,h,lane,state:'pending',clicks:0,lastClick:0,beats:n.beats,holdStart:0,holdNote:null,req:Math.min(Math.max(n.beats,2)*beatSec*0.65,1.4)};
    el.__t=o; tiles.push(o); beat += n.beats;
  });
  S.endT = beat*beatSec + 1.2;
  field.querySelectorAll('.hitline')[0].style.top = hitY+'px';
  songPts=0; songHit=0; songMiss=0; combo=0; els('combo').textContent=0; els('songName').textContent=S.name; els('progBar').style.width='0';
}
function startSong(){
  initAudio(); layout();
  els('intro').style.display='none';
  t0 = AC.currentTime + 0.15; nextBeat=0; lastBeatShown=-1; running=true;
  schedId=setInterval(schedule,25);
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(frame);
}
function schedule(){
  if(!running) return;
  const ahead = AC.currentTime + 0.12;
  while(t0 + nextBeat*beatSec < ahead){
    const t = t0 + nextBeat*beatSec, b = nextBeat; nextBeat++;
    if(b < 4){ hat(t,0.5,5000); if(b===0) kick(t,0.8); continue; }
    if(t0 + b*beatSec > t0 + S.endT) { continue; }
    kick(t, b%2===0?0.9:0.55);
    if(b%2===1) snare(t,0.35);
    hat(t+beatSec/2, 0.3);
    if(b%4===0) bass(t, S.bass, beatSec*1.6, 0.5);
    if(b%4===2) bass(t, S.bass*1.5, beatSec*1.2, 0.35);
  }
}
function now(){ return AC.currentTime - t0; }
function frame(){
  if(!running) return;
  const t = now();
  const bi = Math.floor(t/beatSec);
  if(bi!==lastBeatShown){
    lastBeatShown=bi;
    field.classList.add('pulse'); setTimeout(()=>field.classList.remove('pulse'),120);
    const c=els('count');
    c.textContent = bi===1?'3':bi===2?'2':bi===3?'1':bi===4?'GO! 🎶':'';
  }
  let resolved=0;
  for(const o of tiles){
    const top = hitY - (o.T - t)*speed;
    o.el.style.transform = `translate3d(0,${(top - o.h).toFixed(1)}px,0)`;
    o.top = top;
    if(o.state==='pending' || o.state==='holding'){
      if(o.state==='holding'){
        const held = (performance.now()-o.holdStart)/1000;
        o.el.querySelector('.fill').style.height = Math.min(100,held/o.req*100)+'%';
        if(held>=o.req) completeHold(o);
      } else if(top - o.h > fieldH*0.97){ missTile(o); }
    } else resolved++;
  }
  els('progBar').style.width = (resolved/tiles.length*100)+'%';
  if(t > S.endT && tiles.every(o=>o.state==='done'||o.state==='miss')){ endSong(); return; }
  rafId=requestAnimationFrame(frame);
}
function pop(o,txt){ try{ FX.at(o.el, 10, null, txt); }catch(e){} }
function hint(msg){ const h=els('hint'); h.textContent=msg; h.classList.add('show'); clearTimeout(hint.t); hint.t=setTimeout(()=>h.classList.remove('show'),1400); }
function award(o, hard){
  const err = Math.abs(now()-o.T); const q = err<=0.18?'Perfect!':err<=0.4?'Good!':'OK';
  let p = q==='Perfect!'?20:q==='Good!'?12:6; if(hard) p=Math.round(p*1.5);
  combo++; if(combo>bestCombo) bestCombo=combo; p += Math.min(combo,10);
  points+=p; songPts+=p; songHit++; totalHit++;
  els('pts').textContent=points; els('combo').textContent=combo;
  pop(o, combo>=5?('🔥 '+combo+' combo!'):q);
}
function missTile(o){
  o.state='miss'; o.el.classList.add('miss'); combo=0; songMiss++; els('combo').textContent=0;
  const lbl=o.el.querySelector('span'); if(lbl) lbl.textContent='✖';
}
function doneTile(o){ o.state='done'; o.el.classList.remove('half'); o.el.classList.add('done'); }
function completeHold(o){
  if(o.state!=='holding') return; o.state='holdok'; award(o,true); o.el.classList.add('done'); o.el.style.pointerEvents='none'; o.okAt=true;
}
field.addEventListener('contextmenu', e=>e.preventDefault());
field.addEventListener('pointerdown', e=>{
  if(!running || !AC) return;
  const el = e.target.closest('.tile'); if(!el) return;
  const o = el.__t; if(!o || o.state==='done'||o.state==='miss'||o.state==='holdok') return;
  if(now() < o.T - 3.2*beatSec*1.0 - 1) return;
  const right = e.button===2, tc = performance.now();
  if(o.type==='r'){
    if(!right){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); hint('Use the RIGHT mouse button here! 👉'); return; }
    startNote(freq(o.note)); doneTile(o); award(o,true); return;
  }
  if(right){ hint('Use the LEFT mouse button for this one'); return; }
  if(o.type==='c'){ startNote(freq(o.note)); doneTile(o); award(o,false); }
  else if(o.type==='d'){
    if(o.clicks===0 || tc - o.lastClick > 500){
      o.clicks=1; o.lastClick=tc; el.classList.add('half'); startNote(freq(o.note));
      hint('Click again quickly: double-click! ✌️');
    } else { o.clicks=2; startNote(freq(o.note)); doneTile(o); award(o,true); }
  } else if(o.type==='h'){
    o.state='holding'; o.holdStart=performance.now(); o.holdNote=startNote(freq(o.note),true); o.pid=e.pointerId;
    hint('Keep holding... ⏳');
  }
});
window.addEventListener('pointerup', e=>{
  if(!running) return;
  tiles.forEach(o=>{
    if(o.type==='h' && (o.state==='holding'||o.state==='holdok') && o.pid===e.pointerId){
      o.holdNote && o.holdNote.release();
      if(o.state==='holding'){ // released too early
        o.state='pending'; o.el.querySelector('.fill').style.height='0'; o.el.classList.remove('shake'); void o.el.offsetWidth; o.el.classList.add('shake'); hint('Hold a bit longer next time! ⏳');
      } else { o.state='done'; }
    }
  });
});
window.addEventListener('pointercancel', ()=>{ tiles.forEach(o=>{ if(o.state==='holding'){ o.holdNote&&o.holdNote.release(); o.state='pending'; } }); });

function endSong(){
  running=false; clearInterval(schedId); cancelAnimationFrame(rafId); els('count').textContent='';
  const acc = Math.round(100*songHit/tiles.length), st = acc>=90?3:(acc>=65?2:1);
  songRes.push({name:S.name, acc, pts:songPts, st}); totalTiles += tiles.length;
  const last = songIdx===SONGS.length-1;
  FX.celebrate({ title:last?'ALL SONGS DONE!':'SONG COMPLETE!', sub:`${S.name}: you hit ${songHit} of ${tiles.length} tiles!`,
    stars:st, medal:last?'🏆':'🎵', cheer:['What a beat!','You are a music star!','Mouse master!'][songIdx%3], emoji:['🎶','🥁','🎹'][songIdx%3],
    btn: last?'See my results 🏆':'Next song ▶', long:last, onNext:()=>{ if(last) showFinal(); else { songIdx++; showIntro(); } } });
}
function showFinal(){
  const acc = Math.round(100*totalHit/Math.max(totalTiles,1));
  const ov = document.createElement('div'); ov.className='overlay'; ov.id='final';
  ov.innerHTML = `<div class="card"><div style="font-size:64px">🏆</div><h2>You are a Beat Tiles star!</h2>
    <table class="sum">${songRes.map(r=>`<tr><td>${r.name}</td><td>${'⭐'.repeat(r.st)}</td><td>${r.pts} pts</td></tr>`).join('')}</table>
    <p style="font-size:20px;font-weight:900;color:#FBBF24">⭐ ${points} points</p>
    <p>Accuracy: ${acc}% · Best combo: ${bestCombo} 🔥</p>
    <button class="btn" id="againBtn">Play again 🔄</button></div>`;
  document.body.appendChild(ov);
  els('againBtn').onclick=()=>{ ov.remove(); songIdx=0; points=0; bestCombo=0; totalTiles=0; totalHit=0; songRes.length=0; els('pts').textContent=0; showIntro(); };
  if(window.__submitResultToCloud){
    window.__submitResultToCloud({ name:studentName, game:GAME_LABEL, score:acc, points:points, total:100,
      date:new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) });
  }
}
els('goBtn').addEventListener('click', startSong);
function begin(){
  const v=els('nameInput').value.trim();
  if(!v){ els('nameErr').textContent='Please type your name to start.'; return; }
  studentName=v.slice(0,24); initAudio();
  const b=els('badge'); b.textContent='👤 '+studentName; b.style.display='block';
  els('gate').style.display='none'; showIntro();
}
els('startBtn').addEventListener('click', begin);
els('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') begin(); });
buildLegend();
</script>
