<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Time! - Year 3 Computing Game</title>
<style>
  :root{
    --primary:#DB2777; --secondary:#6366F1; --accent:#FBBF24;
    --light:#FDF2F8; --dark:#3B0A2A; --red:#E74C3C; --green:#06D6A0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:linear-gradient(135deg,#DB2777 0%,#6366F1 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ background:var(--light); border-radius:26px; max-width:620px; width:100%; padding:26px 26px 32px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); position:relative; overflow:hidden; }
  h1{ color:var(--primary); text-align:center; margin:0 0 4px; font-size:clamp(24px,4vw,32px); }
  .sub{ text-align:center; color:#555; margin:0 0 16px; font-size:clamp(13px,2vw,15px); }
  .hud{ display:flex; justify-content:space-between; align-items:center; background:white; border-radius:16px;
    padding:12px 18px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:bold; color:var(--primary);
    flex-wrap:wrap; gap:8px; font-size:clamp(11px,2vw,14px); }
  .hud span.big{ color:var(--secondary); font-size:1.15em; }
  .progress-track{ background:#FCE7F3; border-radius:10px; height:10px; overflow:hidden; margin-bottom:14px; }
  .progress-fill{ background:var(--primary); height:100%; border-radius:10px; transition:width .4s ease; }

  .stage{ background:#FCE7F3; border-radius:22px; padding:0; border:3px dashed #F9A8D4; min-height:440px;
    display:flex; flex-direction:column; overflow:hidden; }

  /* ---- contacts list ---- */
  .contacts-list{ padding:18px; display:flex; flex-direction:column; gap:10px; }
  .contact-card{ background:white; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08); border:3px solid transparent; transition:transform .1s ease; }
  .contact-card.current{ border-color:var(--primary); }
  .contact-card.done{ opacity:0.75; }
  .contact-avatar{ font-size:36px; width:52px; height:52px; border-radius:50%; background:#FCE7F3; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; }
  .contact-info{ flex:1; text-align:left; }
  .contact-name{ font-weight:bold; color:var(--dark); font-size:15.5px; }
  .contact-blurb{ color:#777; font-size:13px; }
  .contact-status{ font-size:22px; width:36px; text-align:center; flex-shrink:0; }
  .chat-btn{ background:var(--primary); color:white; border:none; border-radius:50px; padding:9px 18px;
    font-weight:bold; font-size:13.5px; cursor:pointer; flex-shrink:0; }
  .chat-btn:disabled{ background:#E5B8CF; cursor:not-allowed; }

  /* ---- chat view ---- */
  .chat-header{ background:white; display:flex; align-items:center; gap:12px; padding:12px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  .chat-header .contact-avatar{ font-size:28px; width:42px; height:42px; }
  .chat-header .name{ font-weight:bold; color:var(--dark); font-size:16px; }
  .chat-body{ flex:1; padding:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:320px; }
  .bubble{ max-width:78%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.4; animation:popIn .25s ease; }
  @keyframes popIn{ from{opacity:0; transform:translateY(6px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  .bubble.them{ background:white; color:var(--dark); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .bubble.me{ background:var(--primary); color:white; align-self:flex-end; border-bottom-right-radius:4px; }
  .typing-indicator{ align-self:flex-start; background:white; border-radius:16px; border-bottom-left-radius:4px;
    padding:10px 16px; box-shadow:0 2px 6px rgba(0,0,0,0.08); display:flex; gap:4px; }
  .typing-indicator span{ width:7px; height:7px; border-radius:50%; background:#C4C4C4; animation:bounce 1s infinite ease-in-out; }
  .typing-indicator span:nth-child(2){ animation-delay:0.15s; } .typing-indicator span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0);} 30%{ transform:translateY(-5px);} }

  .reply-options{ padding:10px 16px 16px; display:flex; flex-direction:column; gap:8px; }
  .reply-btn{ background:white; border:2px solid #F9A8D4; border-radius:14px; padding:11px 16px; text-align:left;
    font-size:14.5px; font-weight:bold; color:var(--dark); cursor:pointer; transition:transform .08s ease, border-color .15s ease; }
  .reply-btn:active{ transform:scale(0.98); }
  .reply-btn:hover{ border-color:var(--primary); background:#FFF0F7; }
  .type-reply-row{ padding:10px 16px 16px; display:flex; gap:8px; }
  .type-reply-row input{ flex:1; border:2px solid #F9A8D4; border-radius:50px; padding:10px 16px; font-size:14px; }
  .type-reply-row input:focus{ outline:none; border-color:var(--primary); }
  .type-reply-row button{ background:var(--primary); color:white; border:none; border-radius:50px; padding:0 18px;
    font-weight:bold; cursor:pointer; }
  .skip-link{ text-align:center; font-size:12.5px; color:#999; text-decoration:underline; cursor:pointer; margin-top:-6px; margin-bottom:10px; }

  .sticker-banner{ text-align:center; padding:26px 16px; }
  .sticker-banner .big-sticker{ font-size:64px; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
  .sticker-banner .label{ font-weight:bold; color:var(--primary); font-size:18px; margin:8px 0 4px; }

  .sticker-row{ display:flex; justify-content:center; gap:10px; margin:6px 0 2px; flex-wrap:wrap; }
  .sticker-slot{ width:40px; height:40px; border-radius:50%; background:#FCE7F3; display:flex; align-items:center;
    justify-content:center; font-size:20px; border:2px dashed #F9A8D4; }
  .sticker-slot.earned{ background:white; border:2px solid var(--primary); font-size:24px; }

  .msg{ text-align:center; margin-top:12px; min-height:22px; font-size:clamp(12px,2vw,14px); font-weight:bold; color:var(--primary); }
  .controls{ display:flex; justify-content:center; margin-top:12px; gap:12px; }
  button.ctrl{ background:var(--primary); color:white; border:none; padding:13px 28px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.ctrl.secondary{ background:white; color:var(--primary); border:2px solid var(--primary); }

  .gate-overlay{ position:fixed; inset:0; background:rgba(59,10,42,0.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card{ background:white; border-radius:20px; padding:34px 36px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  .gate-card h2{ color:var(--primary); margin:0 0 8px; font-size:24px; }
  .gate-card p{ color:#555; margin:0 0 16px; font-size:14.5px; }
  .gate-card input{ width:100%; font-size:18px; padding:12px 14px; border-radius:10px; border:2px solid var(--secondary);
    text-align:center; font-weight:bold; color:var(--dark); margin-bottom:14px; box-sizing:border-box; }
  .gate-card input:focus{ outline:none; border-color:var(--primary); }
  .gate-card button{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; }
  .gate-error{ color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; font-weight:bold; }

  #resultsPanel{ display:none; background:white; border-radius:14px; padding:18px 20px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  #resultsPanel h3{ margin:0 0 4px; color:var(--primary); font-size:18px; }
  #resultsPanel .save-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  #resultsPanel .saved-note{ font-size:13px; color:#0e9e6f; font-weight:bold; min-height:18px; margin-top:8px; }
  #savedTableWrap{ margin-top:14px; max-height:220px; overflow:auto; display:none; }
  #savedTableWrap table{ width:100%; border-collapse:collapse; font-size:13px; }
  #savedTableWrap th, #savedTableWrap td{ padding:6px 8px; border-bottom:1px solid #e3e6f0; text-align:left; }
  #savedTableWrap th{ color:var(--primary); }

  .confetti-piece{ position:absolute; top:-20px; width:12px; height:16px; z-index:20; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(600px) rotate(540deg); opacity:0.2; } }
  .final-screen{ text-align:center; padding:20px 10px; }
  .final-screen .trophy{ font-size:76px; }
  .top-bar{ margin:0; }
  .hub-top-btn{ position:fixed; top:12px; left:12px; z-index:300;
    display:inline-flex; align-items:center; gap:6px; background:#1A1A2E; color:white;
    text-decoration:none; font-weight:bold; font-size:clamp(12px,2.2vw,14px); padding:8px 16px 8px 12px;
    border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,0.35); }
  .hub-top-btn:hover{ opacity:0.85; }
  .hub-top-btn:active{ transform:scale(0.96); }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>💬 Chat Time!</h2>
    <p>Type your name to start chatting with your Chat Buddies!</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
    <div class="gate-error" id="nameError"></div>
    <button id="startBtn">Start ▶</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="top-bar"><a href="index.html" class="hub-top-btn">🏠 Back to Hub</a></div>
  <h1>💬 Chat Time!</h1>
  <p class="sub" id="subline">Send friendly messages to your Chat Buddies and collect stickers!</p>

  <div class="hud">
    <div>Player: <span class="big" id="playerName">—</span></div>
    <div>Score: <span class="big" id="score">0</span> ⭐</div>
    <div>Stickers: <span class="big" id="stickerCount">0</span>/<span id="stickerTotal">5</span> 🎁</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="stage" id="stage"><!-- filled by JS --></div>

  <p class="msg" id="msg"></p>
</div>

<script>
// ===================== CONTENT =====================
// A fun, safe, single-player messaging game for Year 3: learners "chat" with friendly
// characters by picking reply bubbles (and can optionally type their own message back).
// No real messages ever leave this page — it's a simulated chat, not real messaging.
const BUDDIES = [
  {
    id:'puppy', name:'Buddy', avatar:'🐶', blurb:'Loves playtime and treats!', sticker:'🦴',
    exchanges:[
      { from:"Hi!! 🐾 I'm Buddy! Want to be chat friends?",
        options:["Yes! Hi Buddy! 🐶","Woof woof! 🐾","Sure, nice to meet you!"],
        reply:"Yay!! 🎉 Let's chat every day!" },
      { from:"What's your favourite thing to do outside?",
        options:["Playing fetch! 🎾","Riding my bike! 🚲","Jumping in puddles! 💦"],
        reply:"That sounds SO fun! I love running around outside too!" },
      { from:"One more thing — what's your favourite snack?",
        options:["Biscuits! 🍪","Apples! 🍎","Pizza! 🍕"],
        reply:"Yummy! My favourite snack is a bone! 🦴" }
    ]
  },
  {
    id:'grandma', name:'Grandma Rosie', avatar:'👵', blurb:'Always has a warm hug to send!', sticker:'❤️',
    exchanges:[
      { from:"Hello dear! How has your day been? 🌼",
        options:["It's been great, thanks!","Pretty good!","A little tiring, but okay!"],
        reply:"Aww, I'm so glad to hear from you! 💛" },
      { from:"I just baked some cookies — what's your favourite thing to bake or cook?",
        options:["Cookies! 🍪","Pancakes! 🥞","I like to help mix things!"],
        reply:"Ooh, lovely choice! We should bake together sometime." },
      { from:"Before I go — what's something that made you smile today?",
        options:["Playing with my friends 😊","A funny joke","Something at school"],
        reply:"That's wonderful! Sending you a big hug! 🤗" }
    ]
  },
  {
    id:'robo', name:'Robo-Pal', avatar:'🤖', blurb:'A curious little robot friend.', sticker:'⚙️',
    exchanges:[
      { from:"BEEP BOOP! 🤖 Hello human friend! What is your favourite game?",
        options:["Letter Rain! ⌨️","A board game! 🎲","Tag with my friends! 🏃"],
        reply:"PROCESSING... that sounds AWESOME! 🤖✨" },
      { from:"If you could build your own robot, what would it do?",
        options:["Clean my room! 🧹","Fly me to school! ✈️","Make ice cream! 🍦"],
        reply:"Excellent idea! I would love a robot like that too!" },
      { from:"One last question — what is your favourite colour?",
        options:["Blue! 🔵","Green! 🟢","Purple! 🟣"],
        reply:"BEEP! Great choice! My circuits light up that colour!" }
    ]
  },
  {
    id:'luna', name:'Captain Luna', avatar:'🧑‍🚀', blurb:'Explorer of planets and stars.', sticker:'🌟',
    exchanges:[
      { from:"Greetings, Earth friend! 🚀 I'm Captain Luna. Have you ever looked at the stars?",
        options:["Yes, they're beautiful! ✨","A little bit!","I'd love to one day!"],
        reply:"Space is full of wonders — I'm glad you love it too!" },
      { from:"If you could visit any planet, which one would you choose?",
        options:["Mars! 🔴","Saturn, for the rings! 🪐","Jupiter, it's huge! 🟠"],
        reply:"A fantastic choice, astronaut-in-training!" },
      { from:"Last one — what would you pack for a trip to space?",
        options:["Snacks! 🍪","My favourite toy! 🧸","A camera to take photos! 📸"],
        reply:"Smart thinking! I'm packing those too! 🚀" }
    ]
  },
  {
    id:'sparkle', name:'Sparkle the Fairy', avatar:'🧚', blurb:'Spreads glitter and good vibes.', sticker:'🌈',
    exchanges:[
      { from:"Twinkle twinkle! ✨ Hello friend, do you believe in a little bit of magic?",
        options:["Yes, definitely! ✨","Maybe a little!","I love magic stories! 📖"],
        reply:"Yay! Magic is everywhere if you look closely!" },
      { from:"What's your favourite colour in a rainbow?",
        options:["Pink! 💗","Yellow! 💛","All of them! 🌈"],
        reply:"A beautiful choice! Rainbows are my favourite thing to paint!" },
      { from:"Before I fly off — what makes you feel happy?",
        options:["Spending time with family","Playing outside","Reading a good book"],
        reply:"That's lovely! Sprinkling some extra sparkle on your day! ✨" }
    ]
  }
];

let buddyIdx = 0, exchangeIdx = 0, score = 0, studentName = "";
const earnedStickers = [];
const STORAGE_KEY = "chatTimeY3Results";
const TOTAL_STEPS = BUDDIES.length * (BUDDIES[0].exchanges.length + 1); // +1 per buddy for the sticker screen

const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const wrap = document.getElementById('wrap');
document.getElementById('stickerTotal').textContent = BUDDIES.length;

function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('stickerCount').textContent = earnedStickers.length;
  const stepsDone = buddyIdx * (BUDDIES[0].exchanges.length + 1) + exchangeIdx;
  document.getElementById('progressFill').style.width = Math.min(100, Math.round(stepsDone/TOTAL_STEPS*100)) + '%';
}

function renderContactsList(){
  msg.textContent = '';
  const html = BUDDIES.map((b, i) => {
    const isDone = i < buddyIdx;
    const isCurrent = i === buddyIdx;
    const statusIcon = isDone ? '✅' : (isCurrent ? '💬' : '🔒');
    return `
      <div class="contact-card ${isCurrent?'current':''} ${isDone?'done':''}">
        <div class="contact-avatar">${b.avatar}</div>
        <div class="contact-info">
          <div class="contact-name">${b.name}</div>
          <div class="contact-blurb">${b.blurb}</div>
        </div>
        <div class="contact-status">${statusIcon}</div>
        <button class="chat-btn" data-idx="${i}" ${isCurrent ? '' : 'disabled'}>${isDone ? 'Done' : 'Chat'}</button>
      </div>`;
  }).join('');
  stage.innerHTML = `<div class="contacts-list">${html}</div>`;
  stage.querySelectorAll('.chat-btn:not(:disabled)').forEach(btn=>{
    btn.addEventListener('click', ()=>{ exchangeIdx = 0; renderChatExchange(); });
  });
  updateHUD();
}

function renderChatExchange(){
  const buddy = BUDDIES[buddyIdx];
  const chatLogHtml = buddy._log ? buddy._log : '';
  const isTypedStep = exchangeIdx >= buddy.exchanges.length;

  stage.innerHTML = `
    <div class="chat-header"><div class="contact-avatar">${buddy.avatar}</div><div class="name">${buddy.name}</div></div>
    <div class="chat-body" id="chatBody">${chatLogHtml}</div>
    <div id="chatFooter"></div>
  `;
  const chatBody = document.getElementById('chatBody');
  chatBody.scrollTop = chatBody.scrollHeight;

  if(isTypedStep){
    renderTypedStep(buddy);
    return;
  }

  const ex = buddy.exchanges[exchangeIdx];
  // show buddy's message with a brief "typing..." delay for realism
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  chatBody.appendChild(typingEl);
  chatBody.scrollTop = chatBody.scrollHeight;

  setTimeout(()=>{
    typingEl.remove();
    appendBubble(chatBody, 'them', ex.from);
    buddy._log = chatBody.innerHTML;
    renderReplyOptions(buddy, ex);
  }, 700);

  updateHUD();
}

function appendBubble(container, who, text){
  const b = document.createElement('div');
  b.className = `bubble ${who}`;
  b.textContent = text;
  container.appendChild(b);
  container.scrollTop = container.scrollHeight;
}

function renderReplyOptions(buddy, ex){
  const footer = document.getElementById('chatFooter');
  footer.innerHTML = `<div class="reply-options">${ex.options.map((opt,i)=>`<button class="reply-btn" data-i="${i}">${opt}</button>`).join('')}</div>`;
  footer.querySelectorAll('.reply-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chatBody = document.getElementById('chatBody');
      const chosen = ex.options[btn.dataset.i];
      appendBubble(chatBody, 'me', chosen);
      footer.innerHTML = '';
      score += 10;
      buddy._log = chatBody.innerHTML;
      updateHUD();
      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span></span><span></span><span></span>';
      chatBody.appendChild(typingEl);
      chatBody.scrollTop = chatBody.scrollHeight;
      setTimeout(()=>{
        typingEl.remove();
        appendBubble(chatBody, 'them', ex.reply);
        buddy._log = chatBody.innerHTML;
        exchangeIdx++;
        setTimeout(renderChatExchange, 650);
      }, 700);
    });
  });
}

function renderTypedStep(buddy){
  const chatBody = document.getElementById('chatBody');
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  chatBody.appendChild(typingEl);
  chatBody.scrollTop = chatBody.scrollHeight;

  setTimeout(()=>{
    typingEl.remove();
    appendBubble(chatBody, 'them', `This was fun! Want to send me one last message before I go?`);
    buddy._log = chatBody.innerHTML;
    const footer = document.getElementById('chatFooter');
    footer.innerHTML = `
      <div class="type-reply-row">
        <input type="text" id="typedMsgInput" placeholder="Type a friendly message..." maxlength="80">
        <button id="sendTypedBtn">Send ▶</button>
      </div>
      <div class="skip-link" id="skipTypedBtn">Skip this step</div>`;
    document.getElementById('typedMsgInput').focus();
    function finishTyped(text){
      footer.innerHTML = '';
      if(text){
        appendBubble(chatBody, 'me', text);
        score += 10;
      }
      buddy._log = chatBody.innerHTML;
      updateHUD();
      setTimeout(()=> showStickerReward(buddy), 500);
    }
    document.getElementById('sendTypedBtn').addEventListener('click', ()=>{
      const val = document.getElementById('typedMsgInput').value.trim().slice(0,80);
      finishTyped(val);
    });
    document.getElementById('typedMsgInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ const val = e.target.value.trim().slice(0,80); finishTyped(val); }
    });
    document.getElementById('skipTypedBtn').addEventListener('click', ()=> finishTyped(''));
  }, 700);
}

function showStickerReward(buddy){
  earnedStickers.push(buddy.sticker);
  score += 20;
  spawnConfetti(24);
  stage.innerHTML = `
    <div class="sticker-banner">
      <div class="big-sticker">${buddy.sticker}</div>
      <div class="label">You earned a sticker from ${buddy.name}!</div>
      <div style="color:#777;font-size:14px;margin-bottom:14px;">Great chatting! 💬</div>
      <div class="controls"><button class="ctrl" id="nextContactBtn">${buddyIdx < BUDDIES.length-1 ? 'Next Chat ▶' : 'See My Results 🏁'}</button></div>
    </div>`;
  updateHUD();
  document.getElementById('nextContactBtn').addEventListener('click', ()=>{
    buddyIdx++;
    if(buddyIdx < BUDDIES.length){ renderContactsList(); } else { showFinal(); }
  });
}

function spawnConfetti(n){
  const colors = ['#DB2777','#6366F1','#FBBF24','#06D6A0','#FFFFFF'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + '%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.2 + Math.random()*1.1) + 's';
    wrap.appendChild(p);
    setTimeout(()=>p.remove(), 2500);
  }
}

function showFinal(){
  document.getElementById('progressFill').style.width = '100%';
  const stickerRow = BUDDIES.map(b => `<div class="sticker-slot earned">${b.sticker}</div>`).join('');
  stage.innerHTML = `
    <div class="final-screen">
      <div class="trophy">🏆</div>
      <div style="font-size:22px;font-weight:bold;color:var(--primary);margin-bottom:6px;">You're a Chat Time star!</div>
      <div style="font-size:16px;color:#555;margin-bottom:10px;">You chatted with all ${BUDDIES.length} buddies!</div>
      <div class="sticker-row">${stickerRow}</div>
      <div style="font-size:19px;font-weight:bold;color:var(--secondary);margin:10px 0 18px;">⭐ Score: ${score} pts</div>
      <div class="controls">
        <button class="ctrl secondary" id="playAgainBtn">Play Again 🔄</button>
      </div>
    </div>`;
  msg.textContent = "";
  spawnConfetti(50);
  document.getElementById('playAgainBtn').addEventListener('click', ()=>{
    buddyIdx = 0; exchangeIdx = 0; score = 0; earnedStickers.length = 0;
    BUDDIES.forEach(b=> b._log = '');
    document.getElementById('score').textContent = score;
    renderContactsList();
  });
  showResultsPanel();

  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: "Chat Time! (Y3)",
      score: score,
      total: 250,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
  }
}

/* ================= RESULTS PANEL ================= */
function showResultsPanel(){
  let panel = document.getElementById('resultsPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'resultsPanel';
    panel.innerHTML = `
      <h3>🏁 Well done!</h3>
      <div id="resultsSummary" style="font-size:14.5px;color:#444;"></div>
      <div class="saved-note" id="cloudSyncNote" style="color:#DB2777;">☁️ Sending your result to your teacher...</div>
      <div class="save-row">
        <button class="ctrl" id="saveResultBtn">💾 Save My Results</button>
        <button class="ctrl secondary" id="downloadAllBtn">📋 Download Class Results</button>
        <button class="ctrl secondary" id="toggleSavedBtn">👀 View Saved Results</button>
      </div>
      <div class="saved-note" id="savedNote"></div>
      <div style="margin-top:14px;"><a href="index.html" style="display:block; background:#1A1A2E; color:white; text-decoration:none; padding:20px 24px; border-radius:16px; font-weight:bold; font-size:22px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.3);">🏠 Back to Hub</a></div>
      <div id="savedTableWrap">
        <table>
          <thead><tr><th>Name</th><th>Score</th><th>Total</th><th>Date</th></tr></thead>
          <tbody id="savedTableBody"></tbody>
        </table>
      </div>`;
    wrap.appendChild(panel);
    document.getElementById('saveResultBtn').addEventListener('click', onSaveResult);
    document.getElementById('downloadAllBtn').addEventListener('click', onDownloadAll);
    document.getElementById('toggleSavedBtn').addEventListener('click', onToggleSaved);
  }
  panel.style.display = 'block';
  document.getElementById('resultsSummary').textContent = `${studentName} scored ${score} points and collected ${earnedStickers.length} stickers!`;
  document.getElementById('savedNote').textContent = '';
  panel.scrollIntoView({ behavior:'smooth', block:'nearest' });

  const cloudNote = document.getElementById('cloudSyncNote');
  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: "Chat Time! (Y3)",
      score: score,
      total: 250,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    }).then(ok => {
      if(cloudNote) cloudNote.textContent = ok
        ? '☁️ Sent to your teacher automatically!'
        : '⚠️ Could not connect to sync automatically — use "Save My Results" below as a backup.';
    });
  } else if(cloudNote){
    cloudNote.textContent = '⚠️ Cloud sync unavailable — use "Save My Results" below as a backup.';
  }
}

function readSavedResults(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }catch(e){ return []; } }
function writeSavedResults(list){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){} }
function csvEscape(v){ const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function renderSavedTable(){
  const list = readSavedResults();
  const body = document.getElementById('savedTableBody');
  body.innerHTML = list.map(r=>`<tr><td>${r.name}</td><td>${r.score}</td><td>${r.total}</td><td>${r.date}</td></tr>`).join('') ||
    '<tr><td colspan="4" style="color:#999;">No saved results yet on this computer.</td></tr>';
}
async function saveCSVWithPicker(filename, rows, noteElId, chosenMsg, fallbackMsg, cancelMsg){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'CSV file', accept: {'text/csv': ['.csv']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(csv);
      await writable.close();
      document.getElementById(noteElId).textContent = chosenMsg;
      return;
    }catch(err){
      if(err && err.name === 'AbortError'){
        document.getElementById(noteElId).textContent = cancelMsg;
        return;
      }
    }
  }
  downloadCSV(filename, rows);
  document.getElementById(noteElId).textContent = fallbackMsg;
}
async function onSaveResult(){
  const now = new Date();
  const record = {
    name: studentName, score: score, total: 250,
    date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  };
  const list = readSavedResults();
  list.push(record);
  writeSavedResults(list);
  const safeName = (studentName || 'student').replace(/[^a-z0-9]+/gi,'_');
  const filename = `ChatTime_${safeName}_${now.toISOString().slice(0,10)}.csv`;
  const rows = [["Name","Score","Total","Date"], [record.name, record.score, record.total, record.date]];
  await saveCSVWithPicker(filename, rows, 'savedNote',
    '✅ Saved! Your results file was saved where you chose, and your score was stored on this computer.',
    '✅ Saved! A results file was downloaded (this browser doesn’t support choosing a save location), and your score was stored on this computer.',
    'Save cancelled — your score is still stored on this computer, so you can still download the class results later.');
  renderSavedTable();
}
async function onDownloadAll(){
  const list = readSavedResults();
  if(list.length === 0){
    document.getElementById('savedNote').textContent = 'No saved results yet on this computer.';
    return;
  }
  const rows = [["Name","Score","Total","Date"], ...list.map(r=>[r.name, r.score, r.total, r.date])];
  const filename = `ChatTime_AllResults_${new Date().toISOString().slice(0,10)}.csv`;
  await saveCSVWithPicker(filename, rows, 'savedNote',
    '✅ Class results saved where you chose.',
    '✅ Class results file downloaded (this browser doesn’t support choosing a save location).',
    'Save cancelled.');
}
function onToggleSaved(){
  const t = document.getElementById('savedTableWrap');
  const showing = t.style.display === 'block';
  t.style.display = showing ? 'none' : 'block';
  if(!showing) renderSavedTable();
}

/* ================= NAME GATE ================= */
const gateOverlay = document.getElementById('gateOverlay');
const nameInput = document.getElementById('nameInput');
const nameError = document.getElementById('nameError');

function startGame(){
  const val = nameInput.value.trim();
  if(!val){
    nameError.textContent = "Please type your name to start.";
    nameInput.focus();
    return;
  }
  studentName = val.slice(0,24);
  document.getElementById('playerName').textContent = studentName;
  gateOverlay.style.display = 'none';
  renderContactsList();
}
document.getElementById('startBtn').addEventListener('click', startGame);
nameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') startGame(); });
nameInput.focus();
