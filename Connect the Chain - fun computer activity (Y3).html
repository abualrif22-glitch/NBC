<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect the Chain! - Year 3 Computing Game</title>
<style>
  :root{
    --primary:#3A0CA3; --secondary:#4CC9F0; --accent:#F72585;
    --light:#F7F7FC; --dark:#1A1A2E; --green:#06D6A0; --red:#E74C3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:linear-gradient(135deg,#3A0CA3 0%,#4CC9F0 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .wrap{ background:var(--light); border-radius:24px; max-width:820px; width:100%; padding:26px 30px 34px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35); position:relative; overflow:hidden; }
  h1{ color:var(--primary); text-align:center; margin:0 0 4px; font-size:clamp(22px,4vw,30px); }
  .sub{ text-align:center; color:#555; margin:0 0 16px; font-size:clamp(13px,2vw,15px); }
  .hud{ display:flex; justify-content:space-between; align-items:center; background:white; border-radius:16px;
    padding:12px 20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:bold; color:var(--primary);
    flex-wrap:wrap; gap:8px; font-size:clamp(13px,2vw,16px); }
  .hud span.big{ color:var(--accent); font-size:1.2em; }
  .chain-display{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .chain-node{ text-align:center; }
  .chain-node .cn-icon{
    width:90px; height:90px; border-radius:20px; background:white; display:flex; align-items:center; justify-content:center;
    font-size:44px; box-shadow:0 6px 16px rgba(0,0,0,0.12); border:3px solid #eee;
  }
  .chain-node.filled .cn-icon{ border-color:var(--green); }
  .chain-node .cn-label{ margin-top:6px; font-size:12.5px; font-weight:bold; color:#666; }
  .chain-arrow{ font-size:24px; color:var(--primary); }
  .stage-label{ text-align:center; font-weight:bold; color:var(--dark); margin-bottom:12px; font-size:16px; }
  .options-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:14px; }
  .opt-card{
    background:white; border:3px solid #eee; border-radius:16px; padding:16px 10px; text-align:center;
    cursor:pointer; transition:transform .12s ease, border-color .12s ease;
  }
  .opt-card:hover{ transform:translateY(-3px); }
  .opt-card .oc-icon{ font-size:38px; }
  .opt-card .oc-label{ font-size:13px; font-weight:bold; color:#444; margin-top:6px; }
  .opt-card.correct{ border-color:var(--green); background:#e6fbf3; }
  .opt-card.wrong{ border-color:var(--red); background:#fdeceb; animation: shakeRed .4s ease; }
  @keyframes shakeRed{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .msg{ text-align:center; margin-top:16px; min-height:34px; font-size:clamp(14px,2.3vw,17px); font-weight:bold; color:var(--primary); }
  .msg.happy{ color:#1a9e6b; } .msg.oops{ color:var(--red); }
  .controls{ display:flex; justify-content:center; margin-top:14px; gap:12px; }
  button.ctrl{ background:var(--primary); color:white; border:none; padding:13px 28px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.ctrl.secondary{ background:white; color:var(--primary); border:2px solid var(--primary); }
  .gate-overlay{ position:fixed; inset:0; background:rgba(26,26,46,0.72); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card{ background:white; border-radius:20px; padding:34px 36px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  .gate-card h2{ color:var(--primary); margin:0 0 8px; font-size:24px; }
  .gate-card p{ color:#555; margin:0 0 18px; font-size:14.5px; }
  .gate-card input{ width:100%; font-size:18px; padding:12px 14px; border-radius:10px; border:2px solid var(--secondary);
    text-align:center; font-weight:bold; color:var(--dark); margin-bottom:14px; box-sizing:border-box; }
  .gate-card input:focus{ outline:none; border-color:var(--primary); }
  .gate-card button{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; }
  .gate-error{ color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; font-weight:bold; }
  #resultsPanel{ display:none; background:white; border-radius:14px; padding:18px 20px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  #resultsPanel h3{ margin:0 0 4px; color:var(--primary); font-size:18px; }
  .save-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .saved-note{ font-size:13px; color:#0e9e6f; font-weight:bold; min-height:18px; margin-top:8px; }
  .confetti-piece{ position:absolute; top:-20px; width:12px; height:16px; z-index:20; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(600px) rotate(540deg); opacity:0.2; } }
  .celebrate-banner{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) scale(0.5); background:white; border-radius:22px;
    padding:24px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.35); text-align:center; z-index:30; opacity:0; pointer-events:none; }
  .celebrate-banner.show{ animation: bannerPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bannerPop{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg);} 60%{opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg);} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);} }
  .celebrate-banner .big{ font-size:24px; font-weight:bold; color:var(--primary); }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>🔗 Connect the Chain!</h2>
    <p>Type your name to start.</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
    <div class="gate-error" id="nameError"></div>
    <button id="startBtn">Start ▶</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <h1>🔗 Connect the Chain!</h1>
  <p class="sub" id="subline">Work out which digital device the input belongs to, then which output it produces!</p>
  <div class="hud">
    <div>Player: <span class="big" id="playerName">—</span></div>
    <div>Round <span class="big" id="roundNum">1</span> / <span id="roundTotal">8</span></div>
    <div>Score: <span class="big" id="score">0</span></div>
  </div>

  <div class="chain-display" id="chainDisplay"></div>
  <div class="stage-label" id="stageLabel"></div>
  <div class="options-grid" id="optionsGrid"></div>
  <p class="msg" id="msg"></p>
</div>

<script>
// Real chains from the Year 3 curriculum's "Device inputs and outputs" activity.
const CHAINS = [
  { input:{icon:"\u2328\uFE0F", label:"Keyboard"}, device:{icon:"\uD83D\uDCBB", label:"Laptop"}, output:{icon:"\uD83D\uDDA5\uFE0F", label:"Screen"} },
  { input:{icon:"\uD83D\uDCF1", label:"Touchscreen"}, device:{icon:"\uD83D\uDCF1", label:"Tablet"}, output:{icon:"\uD83D\uDDA5\uFE0F", label:"Screen"} },
  { input:{icon:"\uD83C\uDFAE", label:"Games Controller"}, device:{icon:"\uD83C\uDFAE", label:"Games Console"}, output:{icon:"\uD83D\uDD0A", label:"Speaker"} },
  { input:{icon:"\uD83D\uDD18", label:"Crossing Button"}, device:{icon:"\uD83D\uDEA6", label:"Pedestrian Crossing"}, output:{icon:"\uD83D\uDEA6", label:"Crossing Lights"} },
];
// Distractor devices/outputs shown alongside the correct answer for variety.
const ALL_DEVICES = [
  {icon:"\uD83D\uDCBB", label:"Laptop"}, {icon:"\uD83D\uDCF1", label:"Tablet"},
  {icon:"\uD83C\uDFAE", label:"Games Console"}, {icon:"\uD83D\uDEA6", label:"Pedestrian Crossing"},
];
const ALL_OUTPUTS = [
  {icon:"\uD83D\uDDA5\uFE0F", label:"Screen"}, {icon:"\uD83D\uDD0A", label:"Speaker"},
  {icon:"\uD83D\uDDA8\uFE0F", label:"Printer"}, {icon:"\uD83D\uDEA6", label:"Crossing Lights"},
];

let rounds = [], roundIdx = 0, score = 0, stage = 'device', studentName = "";
const STORAGE_KEY = "connectTheChainResults";
const wrap = document.getElementById('wrap');

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildRounds(){
  // play through all 4 chains twice, shuffled, for 8 rounds total
  rounds = shuffle([...CHAINS, ...CHAINS]);
}
buildRounds();
document.getElementById('roundTotal').textContent = rounds.length;

function renderChainDisplay(chain, showDevice, showOutput){
  document.getElementById('chainDisplay').innerHTML = `
    <div class="chain-node filled">
      <div class="cn-icon">${chain.input.icon}</div>
      <div class="cn-label">${chain.input.label}</div>
    </div>
    <div class="chain-arrow">➡️</div>
    <div class="chain-node ${showDevice?'filled':''}" id="deviceNode">
      <div class="cn-icon">${showDevice ? chain.device.icon : '❓'}</div>
      <div class="cn-label">${showDevice ? chain.device.label : '?'}</div>
    </div>
    <div class="chain-arrow">➡️</div>
    <div class="chain-node ${showOutput?'filled':''}" id="outputNode">
      <div class="cn-icon">${showOutput ? chain.output.icon : '❓'}</div>
      <div class="cn-label">${showOutput ? chain.output.label : '?'}</div>
    </div>
  `;
}

function renderRound(){
  const chain = rounds[roundIdx];
  stage = 'device';
  document.getElementById('roundNum').textContent = roundIdx+1;
  document.getElementById('msg').className = 'msg';
  document.getElementById('msg').textContent = '';
  renderChainDisplay(chain, false, false);
  document.getElementById('stageLabel').textContent = `Which digital device does the ${chain.input.label} belong to?`;

  const options = shuffle([chain.device, ...shuffle(ALL_DEVICES.filter(d=>d.label!==chain.device.label)).slice(0,3)]);
  document.getElementById('optionsGrid').innerHTML = options.map(o=>`
    <div class="opt-card" data-label="${o.label}">
      <div class="oc-icon">${o.icon}</div><div class="oc-label">${o.label}</div>
    </div>`).join('');
  attachOptionHandlers(chain);
}

function attachOptionHandlers(chain){
  document.querySelectorAll('.opt-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(card.classList.contains('correct') || card.classList.contains('wrong')) return;
      const chosen = card.dataset.label;
      const target = stage === 'device' ? chain.device.label : chain.output.label;
      if(chosen === target){
        card.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        document.getElementById('msg').className = 'msg happy';
        document.getElementById('msg').textContent = '✅ That\'s right!';
        spawnConfetti(14);
        setTimeout(()=> advanceStage(chain), 900);
      } else {
        card.classList.add('wrong');
        document.getElementById('msg').className = 'msg oops';
        document.getElementById('msg').textContent = '❌ Not quite — try another one!';
        setTimeout(()=> card.classList.remove('wrong'), 500);
      }
    });
  });
}

function advanceStage(chain){
  if(stage === 'device'){
    stage = 'output';
    renderChainDisplay(chain, true, false);
    document.getElementById('stageLabel').textContent = `What output does the ${chain.device.label} produce?`;
    document.getElementById('msg').textContent = '';
    const options = shuffle([chain.output, ...shuffle(ALL_OUTPUTS.filter(o=>o.label!==chain.output.label)).slice(0,3)]);
    document.getElementById('optionsGrid').innerHTML = options.map(o=>`
      <div class="opt-card" data-label="${o.label}">
        <div class="oc-icon">${o.icon}</div><div class="oc-label">${o.label}</div>
      </div>`).join('');
    attachOptionHandlers(chain);
  } else {
    renderChainDisplay(chain, true, true);
    showCelebrateBanner('🔗 Chain Complete!', `${chain.input.label} → ${chain.device.label} → ${chain.output.label}`);
    spawnConfetti(24);
    setTimeout(()=>{
      roundIdx++;
      if(roundIdx < rounds.length){ renderRound(); } else { showFinal(); }
    }, 1400);
  }
}

function spawnConfetti(n){
  const colors=['#3A0CA3','#4CC9F0','#F72585','#06D6A0','#FFD23F','#FFFFFF'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'%'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.2+Math.random()*1.1)+'s';
    wrap.appendChild(p); setTimeout(()=>p.remove(),2500);
  }
}
function showCelebrateBanner(text, sub){
  const b=document.createElement('div'); b.className='celebrate-banner';
  b.innerHTML = `<div class="big">${text}</div><div style="font-size:13px;color:#555;">${sub||''}</div>`;
  wrap.appendChild(b); requestAnimationFrame(()=>b.classList.add('show'));
  setTimeout(()=>{ b.style.transition='opacity .3s'; b.style.opacity='0'; setTimeout(()=>b.remove(),320); },1300);
}

function showFinal(){
  const total = rounds.length*10;
  document.getElementById('chainDisplay').innerHTML = `<div style="font-size:70px;">🏆</div>`;
  document.getElementById('stageLabel').textContent = '';
  document.getElementById('optionsGrid').innerHTML = `
    <div style="grid-column:1/-1; text-align:center;">
      <div style="font-size:22px;font-weight:bold;color:var(--primary);margin-bottom:8px;">You're a Chain Connection Expert!</div>
      <div style="font-size:17px;color:#555;margin-bottom:18px;">Final score: ${score} / ${total}</div>
      <button class="ctrl secondary" id="playAgainBtn">Play Again 🔄</button>
    </div>`;
  document.getElementById('msg').textContent = '';
  spawnConfetti(40);
  document.getElementById('playAgainBtn').addEventListener('click', ()=>{
    buildRounds(); roundIdx = 0; score = 0;
    document.getElementById('score').textContent = 0;
    renderRound();
  });
  showResultsPanel(total);
  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: "Connect the Chain! (Y3)",
      score: score,
      total: total,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
  }
}
function showResultsPanel(total){
  let panel = document.getElementById('resultsPanel');
  if(!panel){
    panel = document.createElement('div'); panel.id='resultsPanel';
    panel.innerHTML = `
      <h3>🏁 Well done!</h3>
      <div id="resultsSummary" style="font-size:14.5px;color:#444;"></div>
      <div class="save-row">
        <button class="ctrl" id="saveResultBtn">💾 Save My Results</button>
        <button class="ctrl secondary" id="downloadAllBtn">📋 Download Class Results</button>
      </div>
      <div class="saved-note" id="savedNote"></div>`;
    wrap.appendChild(panel);
    document.getElementById('saveResultBtn').addEventListener('click', ()=>onSaveResult(total));
    document.getElementById('downloadAllBtn').addEventListener('click', onDownloadAll);
  }
  panel.style.display='block';
  document.getElementById('resultsSummary').textContent = `${studentName} scored ${score} out of ${total}.`;
}
function readSavedResults(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch(e){ return []; } }
function writeSavedResults(list){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){} }
function csvEscape(v){ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function onSaveResult(total){
  const now = new Date();
  const record = { name:studentName, score:score, total:total, date: now.toLocaleDateString()+' '+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
  const list = readSavedResults(); list.push(record); writeSavedResults(list);
  const safeName = (studentName||'student').replace(/[^a-z0-9]+/gi,'_');
  downloadCSV(`ConnectTheChain_${safeName}_${now.toISOString().slice(0,10)}.csv`, [["Name","Score","Total","Date"],[record.name,record.score,record.total,record.date]]);
  document.getElementById('savedNote').textContent = '✅ Saved! A results file was downloaded, and your score was stored on this computer.';
}
function onDownloadAll(){
  const list = readSavedResults();
  if(list.length===0){ document.getElementById('savedNote').textContent='No saved results yet on this computer.'; return; }
  const rows=[["Name","Score","Total","Date"], ...list.map(r=>[r.name,r.score,r.total,r.date])];
  downloadCSV(`ConnectTheChain_AllResults_${new Date().toISOString().slice(0,10)}.csv`, rows);
}

const gateOverlay=document.getElementById('gateOverlay');
const nameInput=document.getElementById('nameInput');
const nameError=document.getElementById('nameError');
function startGame(){
  const val = nameInput.value.trim();
  if(!val){ nameError.textContent="Please type your name to start."; nameInput.focus(); return; }
  studentName = val.slice(0,24);
  document.getElementById('playerName').textContent = studentName;
  gateOverlay.style.display='none';
  renderRound();
}
document.getElementById('startBtn').addEventListener('click', startGame);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });
nameInput.focus();
</script>

<!-- ===== Cloud sync: sends each result to the shared Firestore database ===== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCEJtHd802MyuZUlwt6OfGkl9IitHaSOaA",
    authDomain: "tasks-results.firebaseapp.com",
    projectId: "tasks-results",
    storageBucket: "tasks-results.firebasestorage.app",
    messagingSenderId: "1014525306500",
    appId: "1:1014525306500:web:3ffe2e6f5554e9140e04d1"
  };
  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    window.__submitResultToCloud = function(record){
      return db.collection("results").add({
        ...record,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => true).catch((err) => { console.error("Cloud sync failed:", err); return false; });
    };
  }catch(err){
    console.error("Firebase init failed:", err);
  }
</script>
</body>
</html>
