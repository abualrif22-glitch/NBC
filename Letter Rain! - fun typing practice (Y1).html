<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Rain! - Year 1 Computing Game</title>
<style>
  :root{
    --primary:#FF6F91; --secondary:#4FC3F7; --accent:#FFD54F; --green:#66BB6A;
    --light:#FFF9F0; --dark:#2B2250; --red:#E85C4A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:linear-gradient(135deg,#FF6F91 0%,#FFD54F 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ background:var(--light); border-radius:26px; max-width:900px; width:100%; padding:26px 30px 34px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); position:relative; overflow:hidden; }
  h1{ color:var(--primary); text-align:center; margin:0 0 4px; font-size:clamp(24px,4vw,32px); }
  .sub{ text-align:center; color:#6B5B4A; margin:0 0 16px; font-size:clamp(13px,2vw,15px); }
  .hud{ display:flex; justify-content:space-between; align-items:center; background:white; border-radius:16px;
    padding:12px 20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:bold; color:var(--primary);
    flex-wrap:wrap; gap:8px; font-size:clamp(12px,2vw,15px); }
  .hud span.big{ color:var(--red); font-size:1.2em; }
  .stage{ background:#FDF3E7; border-radius:22px; padding:20px; border:3px dashed #F3C98B; position:relative; }
  .sky{ position:relative; height:230px; background:linear-gradient(180deg, #BBDEFB 0%, #E3F2FD 100%);
    border-radius:18px; overflow:hidden; border:3px solid #90CAF9; margin-bottom:14px; }
  .sky::after{ content:'☁️'; position:absolute; top:8px; left:14px; font-size:26px; opacity:0.8; }
  .sky::before{ content:'☁️'; position:absolute; top:20px; right:30px; font-size:20px; opacity:0.6; }
  .falling-letter{ position:absolute; width:50px; height:50px; border-radius:14px; background:var(--primary);
    color:white; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold;
    box-shadow:0 6px 14px rgba(0,0,0,0.25); }
  .falling-letter.caught{ animation: popAway .22s ease forwards; }
  .falling-letter.miss{ background:#E57373; animation: shakeMiss .26s ease; }
  @keyframes popAway{ to{ transform:scale(1.7); opacity:0; } }
  @keyframes shakeMiss{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .keyboard{ user-select:none; }
  .kb-row{ display:flex; justify-content:center; gap:6px; margin-bottom:7px; }
  .kb-row-1{ padding-left:22px; }
  .kb-row-2{ padding-left:44px; }
  .kb-key{ flex:1 1 0; max-width:64px; min-width:30px; height:52px; border:none; border-radius:10px;
    background:#37474F; color:white; font-size:clamp(13px,3vw,19px); font-weight:bold;
    box-shadow:0 3px 0 #20282b, 0 4px 8px rgba(0,0,0,0.25); cursor:pointer; touch-action:manipulation;
    transition:transform .06s ease, background .15s ease; }
  .kb-key:active, .kb-key.pressed{ transform:translateY(2px); box-shadow:0 1px 0 #20282b, 0 2px 4px rgba(0,0,0,0.25); }
  .kb-key.target-key{ background:var(--accent); color:#3a2a00; animation:pulseKey 1s ease-in-out infinite; }
  .kb-key.correct{ background:var(--green); }
  .kb-key.nomatch{ background:#90A4AE; }
  @keyframes pulseKey{
    0%,100%{ box-shadow:0 3px 0 #20282b, 0 4px 8px rgba(0,0,0,0.25), 0 0 0 0 rgba(255,213,79,0.7);}
    50%{ box-shadow:0 3px 0 #20282b, 0 4px 8px rgba(0,0,0,0.25), 0 0 0 12px rgba(255,213,79,0);} }
  .msg{ text-align:center; margin-top:16px; min-height:30px; font-size:clamp(14px,2.3vw,17px); font-weight:bold; color:var(--primary); }
  .msg.happy{ color:#1a9e6b; } .msg.oops{ color:var(--red); }
  .controls{ display:flex; justify-content:center; margin-top:14px; gap:12px; }
  button.ctrl{ background:var(--primary); color:white; border:none; padding:13px 28px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.ctrl.secondary{ background:white; color:var(--primary); border:2px solid var(--primary); }
  .gate-overlay{ position:fixed; inset:0; background:rgba(43,34,80,0.75); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card{ background:white; border-radius:20px; padding:34px 36px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  .gate-card h2{ color:var(--primary); margin:0 0 8px; font-size:24px; }
  .gate-card p{ color:#555; margin:0 0 18px; font-size:14.5px; }
  .gate-card button{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; }
  #tapStartBtn{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; }
  .class-picker{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-height:320px; overflow-y:auto; margin-bottom:6px; }
  .class-btn{ padding:13px 24px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold; font-size:16px; cursor:pointer; }
  .class-btn:hover{ opacity:0.88; }
  .name-picker{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-height:320px; overflow-y:auto; margin-bottom:6px; }
  .name-btn{ padding:13px 22px; border-radius:12px; border:2px solid var(--secondary); background:white; color:var(--dark); font-weight:bold; font-size:16px; cursor:pointer; }
  .name-btn:hover{ background:#eef8fd; }
  .back-to-classes{ background:none; border:none; color:#888; text-decoration:underline; cursor:pointer; font-size:13px; margin-top:10px; display:inline-block; }
  #resultsPanel{ display:none; background:white; border-radius:14px; padding:18px 20px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  #resultsPanel h3{ margin:0 0 4px; color:var(--primary); font-size:18px; }
  .save-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .saved-note{ font-size:13px; color:#0e9e6f; font-weight:bold; min-height:18px; margin-top:8px; }
  .confetti-piece{ position:absolute; top:-20px; width:12px; height:16px; z-index:20; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(600px) rotate(540deg); opacity:0.2; } }
  .celebrate-banner{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) scale(0.5); background:white; border-radius:22px;
    padding:24px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.35); text-align:center; z-index:30; opacity:0; pointer-events:none; }
  .celebrate-banner.show{ animation: bannerPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bannerPop{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg);} 60%{opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg);} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);} }
  .celebrate-banner .big{ font-size:24px; font-weight:bold; color:var(--primary); }
  .top-bar{ margin:0; }
  .hub-top-btn{ position:fixed; top:12px; left:12px; z-index:300;
    display:inline-flex; align-items:center; gap:6px; background:#1A1A2E; color:white;
    text-decoration:none; font-weight:bold; font-size:clamp(12px,2.2vw,14px); padding:8px 16px 8px 12px;
    border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,0.35); }
  .hub-top-btn:hover{ opacity:0.85; }
  .hub-top-btn:active{ transform:scale(0.96); }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>⌨️ Letter Rain!</h2>
    <p id="gateSubtext">Loading...</p>
    <div id="classButtonsArea"></div>
    <div id="nameButtonsArea" style="display:none;"></div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="top-bar"><a href="index.html" class="hub-top-btn">🏠 Back to Hub</a></div>
  <h1>⌨️ Letter Rain!</h1>
  <p class="sub" id="subline">Tap the matching letter on the keyboard before it lands!</p>
  <div class="hud">
    <div>Player: <span class="big" id="playerName">—</span></div>
    <div>Level <span class="big" id="levelNum">1</span>/<span id="levelTotal">5</span> (<span id="levelProgress">0</span>/<span id="levelTarget">6</span>)</div>
    <div>Score: <span class="big" id="scoreCount">0</span> ⭐</div>
    <div>Streak: <span class="big" id="streakCount">0</span> 🔥</div>
  </div>
  <div class="stage" id="stage">
    <div class="sky" id="sky"></div>
    <div class="keyboard" id="keyboard"></div>
  </div>
  <p class="msg" id="msg">Tap the matching letter before it lands!</p>
  <div class="controls">
    <button class="ctrl secondary" id="resetLevelBtn">⟲ Restart Level</button>
  </div>
</div>

<script>
// Year 1: slow falls, tiny starter letter set that grows, keys glow to guide first-time typers.
const LEVELS = [
  { pool:"ASDFJKL",              duration:10000, spawnGap:1400, maxConcurrent:1, target:6,  guide:true  },
  { pool:"ASDFGHJKL",            duration:8800,  spawnGap:1300, maxConcurrent:1, target:7,  guide:true  },
  { pool:"QWERTYUIOPASDFGHJKL",  duration:7600,  spawnGap:1200, maxConcurrent:1, target:8,  guide:true  },
  { pool:"QWERTYUIOPASDFGHJKLZXCVBNM", duration:8400, spawnGap:1700, maxConcurrent:1, target:8,  guide:false },
  { pool:"QWERTYUIOPASDFGHJKLZXCVBNM", duration:7400, spawnGap:1500, maxConcurrent:2, target:10, guide:false },
];
const STORAGE_KEY = "letterRainY1Results";
const GAME_LABEL = "Letter Rain! (Y1)";

let levelIdx = 0, totalCorrect = 0, totalMisses = 0, correctThisLevel = 0, streak = 0, bestStreak = 0, studentName = "";
let activeLetters = [], letterIdCounter = 0, lastSpawnTime = 0, levelActive = false, spawnTimerId = null;

document.getElementById('levelTotal').textContent = LEVELS.length;
const wrap = document.getElementById('wrap');
const msg = document.getElementById('msg');
const STAGE_TEMPLATE = document.getElementById('stage').innerHTML;

function pickRandom(str){ return str[Math.floor(Math.random()*str.length)]; }
const PRAISE = ['⭐ Great catch!','✅ Nice typing!','🎯 Perfect!','👏 Well done!','💪 Keep going!','🌟 Superstar!'];
function pickPraise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

function keyboardRowsHTML(){
  const rows = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
  return rows.map((row,ri)=>`<div class="kb-row kb-row-${ri}">${row.split('').map(ch=>`<button class="kb-key" data-key="${ch}" type="button">${ch}</button>`).join('')}</div>`).join('');
}

function initKeyboard(){
  document.getElementById('keyboard').innerHTML = keyboardRowsHTML();
  document.querySelectorAll('.kb-key').forEach(btn=>{
    btn.addEventListener('click', ()=>handleKeyPress(btn.dataset.key, btn));
  });
}

document.addEventListener('keydown', (e)=>{
  const k = (e.key||'').toUpperCase();
  if(/^[A-Z]$/.test(k)){
    const btn = document.querySelector(`.kb-key[data-key="${k}"]`);
    handleKeyPress(k, btn);
  }
});

function updateHUD(){
  document.getElementById('scoreCount').textContent = totalCorrect;
  document.getElementById('streakCount').textContent = streak;
  document.getElementById('levelProgress').textContent = correctThisLevel;
}

function clearSky(){
  activeLetters.forEach(l=>l.el.remove());
  activeLetters = [];
  document.querySelectorAll('.kb-key.target-key').forEach(k=>k.classList.remove('target-key'));
}

function startLevel(idx){
  levelIdx = idx;
  const cfg = LEVELS[idx];
  correctThisLevel = 0;
  levelActive = true;
  document.getElementById('levelNum').textContent = idx+1;
  document.getElementById('levelTarget').textContent = cfg.target;
  document.getElementById('levelProgress').textContent = '0';
  msg.className = 'msg';
  msg.textContent = 'Tap the matching letter before it lands!';
  clearSky();
  lastSpawnTime = 0;
  if(spawnTimerId) clearInterval(spawnTimerId);
  spawnTimerId = setInterval(tick, 250);
}

function tick(){
  if(!levelActive) return;
  const cfg = LEVELS[levelIdx];
  const now = Date.now();
  if(activeLetters.length < cfg.maxConcurrent && now - lastSpawnTime >= cfg.spawnGap){
    spawnLetter(cfg);
    lastSpawnTime = now;
  }
}

function spawnLetter(cfg){
  const sky = document.getElementById('sky');
  const skyRect = sky.getBoundingClientRect();
  const letter = pickRandom(cfg.pool);
  const el = document.createElement('div');
  el.className = 'falling-letter';
  el.textContent = letter;
  const size = 50;
  const maxLeft = Math.max(0, skyRect.width - size);
  const left = Math.random()*maxLeft;
  el.style.left = left+'px';
  el.style.top = '-60px';
  sky.appendChild(el);
  const id = ++letterIdCounter;
  const record = { id, el, letter, resolved:false };
  activeLetters.push(record);

  if(cfg.guide){
    const keyBtn = document.querySelector(`.kb-key[data-key="${letter}"]`);
    if(keyBtn) keyBtn.classList.add('target-key');
  }

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(!el.isConnected) return;
      el.style.transition = `top ${cfg.duration}ms linear`;
      const bottom = Math.max(0, skyRect.height - size);
      el.style.top = bottom+'px';
    });
  });

  el.addEventListener('transitionend', ()=> onLetterMissed(record));
}

function removeActive(record){
  activeLetters = activeLetters.filter(l=>l.id!==record.id);
  const stillNeeded = activeLetters.some(l=>l.letter===record.letter && !l.resolved);
  if(!stillNeeded){
    const keyBtn = document.querySelector(`.kb-key[data-key="${record.letter}"]`);
    if(keyBtn) keyBtn.classList.remove('target-key');
  }
}

function onLetterMissed(record){
  if(record.resolved) return;
  record.resolved = true;
  removeActive(record);
  totalMisses++;
  streak = 0;
  record.el.classList.add('miss');
  setTimeout(()=>record.el.remove(), 260);
  msg.className = 'msg oops';
  msg.textContent = "That one got away — try to catch the next one!";
  updateHUD();
}

function handleKeyPress(letter, btnEl){
  if(!letter) return;
  if(btnEl){
    btnEl.classList.add('pressed');
    setTimeout(()=>btnEl.classList.remove('pressed'),120);
  }
  if(!levelActive) return;
  const match = activeLetters.find(l=>l.letter===letter && !l.resolved);
  if(match){
    match.resolved = true;
    removeActive(match);
    catchLetter(match, btnEl);
  } else if(btnEl){
    btnEl.classList.add('nomatch');
    setTimeout(()=>btnEl.classList.remove('nomatch'),150);
  }
}

function catchLetter(record, btnEl){
  totalCorrect++;
  correctThisLevel++;
  streak++;
  if(streak>bestStreak) bestStreak = streak;
  record.el.classList.add('caught');
  setTimeout(()=>record.el.remove(), 220);
  spawnConfetti(10);
  if(btnEl){ btnEl.classList.add('correct'); setTimeout(()=>btnEl.classList.remove('correct'),200); }
  msg.className = 'msg happy';
  msg.textContent = pickPraise();
  updateHUD();
  if(streak>0 && streak%5===0){
    showCelebrateBanner(`🔥 ${streak} in a row!`, 'Amazing typing streak!');
  }
  if(correctThisLevel >= LEVELS[levelIdx].target){
    levelActive = false;
    clearInterval(spawnTimerId);
    setTimeout(levelComplete, 500);
  }
}

function spawnConfetti(n){
  const colors=['#FF6F91','#4FC3F7','#FFD54F','#66BB6A','#2B2250','#FFFFFF'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'%'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.2+Math.random()*1.1)+'s';
    wrap.appendChild(p); setTimeout(()=>p.remove(),2500);
  }
}
function showCelebrateBanner(text, sub){
  const b=document.createElement('div'); b.className='celebrate-banner';
  b.innerHTML = `<div class="big">${text}</div><div style="font-size:14px;color:#555;">${sub||''}</div>`;
  wrap.appendChild(b); requestAnimationFrame(()=>b.classList.add('show'));
  setTimeout(()=>{ b.style.transition='opacity .3s'; b.style.opacity='0'; setTimeout(()=>b.remove(),320); },1300);
}

function levelComplete(){
  spawnConfetti(30);
  showCelebrateBanner('🎉 Level Complete!', `You did it, ${studentName}!`);
  clearSky();
  levelIdx++;
  if(levelIdx < LEVELS.length){
    setTimeout(()=>startLevel(levelIdx), 1400);
  } else {
    setTimeout(showFinal, 1400);
  }
}

function showFinal(){
  const accuracy = Math.max(0, Math.round(100 * totalCorrect / Math.max(totalCorrect+totalMisses,1)));
  document.getElementById('stage').innerHTML = `
    <div style="text-align:center; padding:30px 10px;">
      <div style="font-size:76px;">🏆</div>
      <div style="font-size:22px;font-weight:bold;color:var(--primary);margin-bottom:8px;">You finished Letter Rain!</div>
      <div style="font-size:17px;color:#555;margin-bottom:6px;">Accuracy: ${accuracy}% (${totalCorrect} caught, ${totalMisses} missed)</div>
      <div style="font-size:15px;color:#777;margin-bottom:18px;">Best streak: ${bestStreak} 🔥</div>
      <button class="ctrl secondary" id="playAgainBtn">Play Again 🔄</button>
    </div>`;
  msg.textContent = '';
  document.getElementById('playAgainBtn').addEventListener('click', ()=>{
    levelIdx = 0; totalCorrect = 0; totalMisses = 0; streak = 0; bestStreak = 0;
    document.getElementById('stage').innerHTML = STAGE_TEMPLATE;
    initKeyboard();
    startLevel(0);
  });
  showResultsPanel(accuracy);

  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: GAME_LABEL,
      score: accuracy,
      total: 100,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
  }
}

function showResultsPanel(accuracy){
  let panel = document.getElementById('resultsPanel');
  if(!panel){
    panel = document.createElement('div'); panel.id='resultsPanel';
    panel.innerHTML = `
      <h3>🏁 Well done!</h3>
      <div id="resultsSummary" style="font-size:14.5px;color:#444;"></div>
      <div class="save-row">
        <button class="ctrl" id="saveResultBtn">💾 Save My Results</button>
        <button class="ctrl secondary" id="downloadAllBtn">📋 Download Class Results</button>
      </div>
      <div class="saved-note" id="savedNote"></div>
      <div style="margin-top:14px;"><a href="index.html" style="display:block; background:#1A1A2E; color:white; text-decoration:none; padding:20px 24px; border-radius:16px; font-weight:bold; font-size:22px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.3);">🏠 Back to Hub</a></div>`;
    wrap.appendChild(panel);
    document.getElementById('saveResultBtn').addEventListener('click', onSaveResult);
    document.getElementById('downloadAllBtn').addEventListener('click', onDownloadAll);
  }
  panel.style.display='block';
  document.getElementById('resultsSummary').textContent = `${studentName} finished with ${accuracy}% accuracy.`;
  document.getElementById('savedNote').textContent = '';
}
function readSavedResults(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch(e){ return []; } }
function writeSavedResults(list){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){} }
function csvEscape(v){ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function onSaveResult(){
  const accuracy = Math.max(0, Math.round(100 * totalCorrect / Math.max(totalCorrect+totalMisses,1)));
  const now = new Date();
  const record = { name:studentName, score:accuracy, total:100, date: now.toLocaleDateString()+' '+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
  const list = readSavedResults(); list.push(record); writeSavedResults(list);
  const safeName = (studentName||'student').replace(/[^a-z0-9]+/gi,'_');
  downloadCSV(`LetterRainY1_${safeName}_${now.toISOString().slice(0,10)}.csv`, [["Name","Score","Total","Date"],[record.name,record.score,record.total,record.date]]);
  document.getElementById('savedNote').textContent = '✅ Saved! A results file was downloaded, and your score was stored on this computer.';
}
function onDownloadAll(){
  const list = readSavedResults();
  if(list.length===0){ document.getElementById('savedNote').textContent='No saved results yet on this computer.'; return; }
  const rows=[["Name","Score","Total","Date"], ...list.map(r=>[r.name,r.score,r.total,r.date])];
  downloadCSV(`LetterRainY1_AllResults_${new Date().toISOString().slice(0,10)}.csv`, rows);
}

document.getElementById('resetLevelBtn').addEventListener('click', ()=>{
  correctThisLevel = 0;
  startLevel(levelIdx);
});

const gateOverlay=document.getElementById('gateOverlay');

function readClassesFromLocalStorage(){
  try{ return JSON.parse(localStorage.getItem('classroomDashboardClasses') || '[]'); }catch(e){ return []; }
}

function initNameGate(){
  const GAME_YEAR = '1';
  const SKIP_NAME_STEP = (GAME_YEAR === '1' || GAME_YEAR === '2');
  // Class/name picker temporarily disabled for all years — flip to true to restore.
  const CLASS_PICKER_ENABLED = false;
  const classes = CLASS_PICKER_ENABLED
    ? readClassesFromLocalStorage()
        .filter(c => (c.students||[]).length > 0)
        .filter(c => (c.name||'').trim().charAt(0) === GAME_YEAR)
    : [];
  const subtext = document.getElementById('gateSubtext');
  const classArea = document.getElementById('classButtonsArea');
  const nameArea = document.getElementById('nameButtonsArea');

  if(classes.length === 0){
    subtext.textContent = "Just tap below to play!";
    classArea.innerHTML = '<button id="tapStartBtn">Tap to Start! ▶</button>';
    document.getElementById('tapStartBtn').addEventListener('click', () => startGameWithName('Player'));
    return;
  }

  function showNamesFor(cls, showBack){
    classArea.style.display = 'none';
    nameArea.style.display = 'block';
    subtext.textContent = "Tap your name to start!";
    let html = '<div class="name-picker">';
    cls.students.forEach(s => {
      html += `<button class="name-btn" data-name="${s.name}">${s.name}</button>`;
    });
    html += '</div>';
    if(showBack) html += '<button class="back-to-classes" id="backToClassesBtn">◀ Back to classes</button>';
    nameArea.innerHTML = html;
    nameArea.querySelectorAll('.name-btn').forEach(btn => {
      btn.addEventListener('click', () => startGameWithName(btn.dataset.name));
    });
    const backBtn = document.getElementById('backToClassesBtn');
    if(backBtn) backBtn.addEventListener('click', () => {
      nameArea.style.display = 'none';
      classArea.style.display = 'block';
      subtext.textContent = "Tap your class!";
    });
  }

  if(classes.length === 1){
    if(SKIP_NAME_STEP){ startGameWithName('Player'); } else { showNamesFor(classes[0], false); }
    return;
  }

  subtext.textContent = "Tap your class!";
  classArea.innerHTML = '<div class="class-picker">' +
    classes.map(c => `<button class="class-btn" data-id="${c.id}">${c.name}</button>`).join('') +
    '</div>';
  classArea.querySelectorAll('.class-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cls = classes.find(c => c.id === btn.dataset.id);
      if(SKIP_NAME_STEP){ startGameWithName('Player'); } else { showNamesFor(cls, true); }
    });
  });
}

function startGameWithName(name){
  studentName = name.slice(0,24);
  document.getElementById('playerName').textContent = studentName;
  gateOverlay.style.display='none';
  initKeyboard();
  startLevel(0);
}
initNameGate();
</script>
