<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sam's Safe Tech Day - Year 2 Computing Game</title>
<style>
:root{--ink:#27324A;--cream:#FFF9EC;--orange:#FF8A3D;--green:#2FB872;--red:#E5484D;--blue:#3B82F6;--yellow:#FFC93C;--pink:#FF6FA5;--sky:#9AD8FF;--ground:#7BC96F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',Arial,sans-serif;color:var(--ink);background:#FDE9C8;user-select:none;touch-action:manipulation}
body{padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:860px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.title{font-weight:900;font-size:clamp(18px,3.4vw,26px);flex:1}
.title small{display:block;font-size:.55em;opacity:.7}
.score{background:#fff;border-radius:99px;padding:6px 16px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.track{position:relative;height:34px;background:#fff;border-radius:99px;margin-bottom:10px;box-shadow:inset 0 0 0 3px #fff, 0 3px 0 rgba(0,0,0,.1);overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFE08A,#FFB86B,#8EA4FF,#3B3F8F);border-radius:99px;transition:width .6s}
.track .sun{position:absolute;top:2px;font-size:26px;transition:left .6s;transform:translateX(-50%)}
.card{background:var(--cream);border-radius:26px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.stage{position:relative;height:clamp(190px,34vw,260px);border-radius:20px;overflow:hidden;background:var(--sky);margin-bottom:12px;border:4px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.stage .gnd{position:absolute;left:0;right:0;bottom:0;height:28%;background:var(--ground)}
.stage .bg{position:absolute;font-size:clamp(34px,7vw,56px);opacity:.9}
.stage .ch{position:absolute;bottom:14%;transform:translateX(-50%);line-height:1;transition:all .5s}
.stage .place{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.85);padding:4px 12px;border-radius:99px;font-weight:900;font-size:clamp(13px,2.4vw,17px)}
.stage .fx{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(50px,12vw,100px);pointer-events:none}
.fx.bad{animation:boom .9s forwards}.fx.good{animation:twinkle 1.1s forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes twinkle{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}40%{transform:translate(-50%,-70%) scale(1.2);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
.wobble{animation:wob .5s}
@keyframes wob{25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
.story{background:#fff;border-radius:18px;padding:12px 16px;font-size:clamp(22px,4vw,32px);text-align:center;font-weight:700;line-height:1.35;margin-bottom:10px;border-left:8px solid var(--orange)}
.story b{color:var(--orange)}
.q{font-weight:900;text-align:center;font-size:clamp(22px,3.8vw,30px);margin:8px 0}
.opts{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}@media(max-width:560px){.opts{grid-template-columns:1fr}.opt{flex-direction:row!important}}
.opt{display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;min-height:150px;background:#fff;border:4px solid #EADFC8;border-radius:20px;padding:12px 14px;font-weight:800;font-size:clamp(18px,3vw,24px);cursor:pointer;box-shadow:0 5px 0 #E3D5B6;text-align:center;font-family:inherit;color:var(--ink);width:100%}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #E3D5B6}
.opt .em{font-size:clamp(56px,11vw,84px);line-height:1}
.opt.good{background:#DDF7E8;border-color:var(--green);box-shadow:0 5px 0 #A5E3C1;pointer-events:none}
.opt.bad{background:#FFE3E3;border-color:var(--red);box-shadow:0 5px 0 #F2B6B6;pointer-events:none;opacity:.75}
.msg{margin-top:10px;border-radius:18px;padding:12px 16px;font-weight:900;font-size:clamp(22px,3.8vw,30px);line-height:1.3;text-align:center}
.msg.bad{background:#FFE3E3;color:#8A1C20}.msg.good{background:#DDF7E8;color:#14532D}
.rule{display:inline-block;background:var(--yellow);color:#5A3B00;border-radius:99px;padding:6px 18px;font-weight:900;margin-top:8px;font-size:clamp(20px,3.4vw,28px)}
.btn{border:none;border-radius:18px;background:var(--orange);color:#fff;font-weight:900;font-size:clamp(18px,3.2vw,26px);padding:12px 32px;cursor:pointer;box-shadow:0 7px 0 #C96A24;font-family:inherit;margin-top:12px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #C96A24}
.btn.green{background:var(--green);box-shadow:0 7px 0 #1E8A54}
.center{text-align:center}.hidden{display:none!important}
/* gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:linear-gradient(#9AD8FF,#FDE9C8)}
.gatebox{background:var(--cream);border-radius:28px;max-width:520px;width:100%;text-align:center;padding:26px;box-shadow:0 12px 0 rgba(0,0,0,.14)}
.gatebox .big{font-size:80px}.gatebox h1{margin:4px 0;font-size:clamp(28px,6vw,42px);color:var(--orange)}
.gatebox input{width:100%;font-size:26px;padding:12px;border-radius:16px;border:4px solid var(--sky);text-align:center;margin:12px 0 4px;font-family:inherit}
.err{color:var(--red);font-weight:800;min-height:22px}
/* room game */
.room{position:relative;background:linear-gradient(#FFF1D6 70%,#D9B98A 70%);border-radius:20px;height:clamp(300px,52vw,380px);border:4px solid #fff;margin-bottom:8px}
.item{position:absolute;transform:translate(-50%,-50%);font-size:clamp(40px,9vw,66px);cursor:pointer;line-height:1;background:none;border:none;padding:6px;border-radius:16px}
.item.found{background:#DDF7E8;outline:4px solid var(--green)}
.item .t{display:block;font-size:clamp(13px,2.2vw,17px);font-weight:800;margin-top:2px}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mc{background:#fff;border:4px solid #EADFC8;border-radius:16px;padding:10px;font-weight:800;text-align:center;cursor:pointer;font-size:clamp(14px,2.5vw,19px)}
.mc .em{display:block;font-size:clamp(34px,7vw,52px)}
.mc.sel{border-color:var(--blue);background:#E7F0FF}.mc.done{border-color:var(--green);background:#DDF7E8;pointer-events:none}.mc.bad{animation:wob .5s;border-color:var(--red)}
.hint{min-height:30px;text-align:center;font-weight:800;margin-top:8px}
/* finish */
.cert{border:8px double var(--orange);border-radius:22px;background:#fff;padding:18px;text-align:center}
.cert h2{margin:0;color:var(--orange);font-size:clamp(24px,5vw,38px)}
.cert .nm{font-size:clamp(28px,6vw,44px);font-weight:900;color:var(--pink)}
.book{display:grid;gap:8px;text-align:left;margin:10px auto;max-width:600px}
.book .r{background:#F5FFF9;border:3px solid #BDEBD0;border-radius:14px;padding:8px 12px;font-weight:800;display:flex;gap:10px;align-items:center;cursor:pointer}
.book .r.pick{background:#FFF3C4;border-color:var(--yellow)}
.book .r .em{font-size:28px}
.note{font-weight:700;color:#6b7280;min-height:20px;margin-top:6px}
.floating-name-badge{position:fixed;right:10px;bottom:10px;background:#fff;font-weight:900;font-size:20px;padding:8px 16px;border-radius:99px;box-shadow:0 4px 0 rgba(0,0,0,.2);z-index:40;display:none}
</style>
</head>
<body>
<div id="gate"><div class="gatebox"><div class="big">🧒🐶</div><h1>Sam's Safe Tech Day</h1>
<div style="font-weight:900;font-size:26px">Help Sam have a safe day! 🌅➡️🌙</div>
<input id="nameInput" placeholder="✏️ Your name" maxlength="24" autocomplete="off"><div class="err" id="nameErr"></div>
<button class="btn" id="startBtn">Start ▶</button></div></div>
<div id="app" class="hidden">
  <div class="top"><div class="title">🌈 Sam's Safe Tech Day<small>Year 2 · Using IT safely</small></div><div class="score">⭐ <span id="score">0</span></div></div>
  <div class="track"><div class="fill" id="fill" style="width:0"></div><div class="sun" id="sun" style="left:3%">🌅</div></div>
  <div class="card" id="main"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let studentName="", score=0, step=0; const learned=[];
const SKY={morning:'linear-gradient(#FFE9A8,#BFE6FF)',day:'linear-gradient(#7CC8FF,#CFF0FF)',eve:'linear-gradient(#FFB27A,#FFE3B0)',night:'linear-gradient(#1D2455,#4B5BA8)'};
const GROUND={morning:'#8ED27F',day:'#7BC96F',eve:'#B8A268',night:'#2D4A3E'};
/* ----------- story scenes ----------- */
const S=[
 {sky:'morning',place:'🏠 Home',icon:'🌅',cast:[['🧒',30,84],['📱',52,48],['🐶',72,56]],bg:[['☀️',82,10],['☁️',15,10]],
  story:'🌅 Sam has a tablet. Stairs!',q:'What should Sam do?',
  o:[['🏃','Run','💥','Crash! The tablet breaks.',0],['🙌','Walk, two hands','✨','Safe!',1],['🤾','Throw it','💥','Crash! The tablet breaks.',0]],
  rule:'Walk. Use two hands.',ri:'🙌'},
 {sky:'morning',place:'🍳 Breakfast',icon:'🍳',cast:[['🧒',28,84],['👩',72,88],['📱',50,44]],bg:[['🥣',46,62],['🧃',58,62]],
  story:'🍳 Breakfast time!',q:'What should Sam do?',
  o:[['📺','Watch and eat','💦','Splash! Milk on the screen.',0],['🗄️','Put it away','✨','Yes! Talk and eat.',1],['🧃','Juice by it','💦','Splash! Wet tablet.',0]],
  rule:'No tablets at the table.',ri:'🍽️'},
 {sky:'morning',place:'🎮 Games',icon:'🎮',cast:[['🧒',30,84],['👩',70,88]],bg:[['📺',50,18],['🛋️',50,58]],
  story:'🎮 The game says 12+. Sam is 7.',q:'What should Sam do?',
  o:[['🔞','Play it','😨','Too scary!',0],['🙋','Ask Mum','✨','Mum finds a game for 7!',1],['🎲','Any game','😨','Not for kids!',0]],
  rule:'Games for my age.',ri:'🔞'},
 {sky:'day',place:'🚌 Bus',icon:'🚌',cast:[['🧒',28,76],['👧',64,76],['📱',46,44]],bg:[['🚌',50,60],['🌳',88,45]],
  story:'👧 Zara wants a turn.',q:'What should Sam do?',
  o:[['😤','No! Mine!','😢','Zara is sad.',0],['🤝','Take turns','✨','Zara is happy!',1],['🙈','Hide it','😢','Zara is sad.',0]],
  rule:'Take turns.',ri:'🤝'},
 'ROOM',
 {sky:'day',place:'🏫 Class',icon:'🏫',cast:[['🧒',25,84],['🧑',58,84],['📱',42,46],['🧑‍🏫',85,86]],bg:[['📚',12,20],['🖼️',70,12]],
  story:'🧑 Max grabs the tablet!',q:'What should Sam do?',
  o:[['🤜','Grab back','💥','Crash! It falls.',0],['🗣️','Say "please"','✨','Max says OK!',1],['🙈','Hide','😟','Still sad.',0]],
  rule:'Use kind words.',ri:'🗣️'},
 {sky:'day',place:'🔔 Class',icon:'🔔',cast:[['🧒',25,84],['🧑‍🏫',75,88],['📱',45,46]],bg:[['🔔',50,14]],
  story:'🔔 Teacher says: "Tablets down!"',q:'What should Sam do?',
  o:[['🎮','One more go','😠','Teacher is cross.',0],['⏬','Put it down','✨','Good listening!',1],['🤫','Play secretly','😠','Teacher is cross.',0]],
  rule:'Listen to the teacher.',ri:'⏰'},
 {sky:'day',place:'🍎 Lunch',icon:'🍎',cast:[['🧒',28,84],['💻',60,48]],bg:[['🥤',48,62],['🥪',80,60]],
  story:'🥤 Where is the water?',q:'Where should it go?',
  o:[['💻','By the laptop','💦','Splash! Wet laptop.',0],['🪑','Far away','✨','The laptop stays dry!',1],['🙆','Over the keys','💦','Splash! Wet laptop.',0]],
  rule:'Drinks away from devices.',ri:'🥤'},
 {sky:'day',place:'🖥️ Computer',icon:'🖥️',cast:[['🧒',25,84],['💻',60,48],['🧑‍🏫',86,86]],bg:[['🎁',60,12]],
  story:'🎁 A pop-up! "You won!"',q:'What should Sam do?',
  o:[['👆','Click it','⚠️','Careful! A trick.',0],['🙋','Tell the teacher','✨','Teacher helps!',1],['🤐','Tell nobody','😟','Tell a grown-up!',0]],
  rule:'Tell a grown-up.',ri:'🗣️'},
 'MATCH',
 {sky:'eve',place:'🌳 Park',icon:'📸',cast:[['🧒',25,84],['👧🏽',68,84],['📷',45,46]],bg:[['🌳',10,40],['🌳',90,40]],
  story:'📷 Sam wants a photo of Lily.',q:'What should Sam do?',
  o:[['📸','Click!','😕','Lily did not know.',0],['🙋','Ask first','✨','Lily says yes!',1],['🌿','Sneak','😕','Not kind.',0]],
  rule:'Ask first.',ri:'📷'},
 {sky:'eve',place:'🌳 Park',icon:'🙅',cast:[['🧒',25,84],['👧🏽',68,84],['📷',45,46]],bg:[['🌳',10,40]],
  story:'🙅 Lily says NO.',q:'What should Sam do?',
  o:[['📸','Take it','😢','Lily is sad.',0],['👍','OK! Camera away','✨','Kind Sam!',1],['📲','Show everyone','😢','Lily is sad.',0]],
  rule:'No means no.',ri:'🙅'},
 {sky:'night',place:'🛏️ Bed',icon:'🌙',cast:[['🧒',30,84],['📱',55,52],['🐶',74,84]],bg:[['🌙',82,10],['⭐',20,12],['⭐',60,18]],
  story:'🌙 Bedtime!',q:'What should Sam do?',
  o:[['🛏️','Watch in bed','😴','Sam is tired.',0],['🔌','Switch off','✨','Sweet dreams!',1],['⏳','5 more minutes','😴','Sam is tired.',0]],
  rule:'Screens off at bedtime.',ri:'🌙'},
 {sky:'night',place:'🛏️ Bed',icon:'😟',cast:[['🧒',30,84],['👩',72,88]],bg:[['🌙',82,10]],
  story:'😟 Sam saw something scary.',q:'What should Sam do?',
  o:[['🤫','Keep it secret','😟','Still worried.',0],['🗣️','Tell Mum','✨','Mum helps. Hug!',1],['😶','Tell nobody','😟','Still worried.',0]],
  rule:'Tell a grown-up.',ri:'🗣️'}
];
const TOTAL=12+2+4;
/* ----------- helpers ----------- */
function setProgress(){ const n=S.length; const pct=Math.min(100,(step/n)*100); $('fill').style.width=pct+'%'; $('sun').style.left=Math.max(3,pct)+'%'; $('score').textContent=score; }
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function show(html){ $('main').innerHTML=html; window.scrollTo({top:0,behavior:'smooth'}); }
function stageHtml(sc){
  const bg=sc.bg.map(b=>`<div class="bg" style="left:${b[1]}%;top:${b[2]}%;transform:translateX(-50%)">${b[0]}</div>`).join('');
  const ch=sc.cast.map(c=>`<div class="ch" style="left:${c[1]}%;font-size:${c[2]}px">${c[0]}</div>`).join('');
  return `<div class="stage" id="stage" style="background:${SKY[sc.sky]}"><div class="gnd" style="background:${GROUND[sc.sky]}"></div><div class="place">${sc.place}</div>${bg}${ch}</div>`;
}
function fx(e,cls){ const st=$('stage'); const d=document.createElement('div'); d.className='fx '+cls; d.textContent=e; st.appendChild(d); setTimeout(()=>d.remove(),1200); }
/* ----------- flow ----------- */
function next(){ step++; setProgress(); if(step>=S.length){ finish(); return; } const s=S[step]; if(s==='ROOM') return roomGame(); if(s==='MATCH') return matchGame(); scene(s); }
function scene(sc){
  let tried=false; $('sun').textContent=sc.icon;
  show(stageHtml(sc)+`<div class="story">${sc.story}</div><div class="q">${sc.q}</div><div class="opts">${sc.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="em">${o[0]}</span><span>${esc(o[1])}</span></button>`).join('')}</div><div id="out"></div>`);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=sc.o[b.dataset.i]; const out=$('out');
    if(o[4]){ b.classList.add('good'); document.querySelectorAll('.opt').forEach(x=>{ if(x!==b) x.style.opacity=.45; x.style.pointerEvents='none'; }); fx(o[2],'good'); if(!tried) score++; learned.push([sc.ri,sc.rule]); setProgress();
      out.innerHTML=`<div class="msg good">😊 ${esc(o[3])}<br><span class="rule">${sc.ri} ${esc(sc.rule)}</span></div><div class="center"><button class="btn green" id="nx">Next ▶</button></div>`; $('nx').onclick=next; $('nx').scrollIntoView({behavior:'smooth',block:'center'});
    } else { tried=true; b.classList.add('good','bad'); b.classList.remove('good'); b.classList.add('bad'); fx(o[2],'bad'); const st=$('stage'); st.classList.remove('wobble'); void st.offsetWidth; st.classList.add('wobble');
      out.innerHTML=`<div class="msg bad">😢 ${esc(o[3])}<br>🔄 Try again!</div>`; out.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  });
}
/* ----------- messy room mini-game ----------- */
function roomGame(){
  $('sun').textContent='🧹'; let wrong=false, found=0;
  const items=[['🥤','Drink by the laptop',20,62,1],['📱','Tablet on the edge',64,50,1],['🔌','Cable on the floor',38,86,1],['🍕','Food on the keyboard',82,62,1],['🔞','Game for big kids',50,26,1],
    ['💻','Laptop on a desk',12,36,0],['🎧','Headphones on a hook',88,28,0],['🖥️','Computer on the desk',32,40,0],['🔋','Charger on the wall',70,82,0]];
  show(`<div class="story"><b>🧹 Messy Room!</b><br>👆 Tap 5 things that are NOT safe ❌</div><div class="room" id="room">${items.map((it,i)=>`<button class="item" data-i="${i}" style="left:${it[2]}%;top:${it[3]}%">${it[0]}<span class="t">${it[1]}</span></button>`).join('')}</div><div class="hint" id="hint">Found 0 of 5</div>`);
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ const it=items[b.dataset.i];
    if(it[4]){ if(b.classList.contains('found')) return; b.classList.add('found'); found++; $('hint').textContent=`Found ${found} of 5`; if(found===5){ const p=wrong?1:2; score+=p; setProgress(); $('hint').innerHTML=`🎉 All found!<br><button class="btn green" id="nx">Next ▶</button>`; $('nx').onclick=next; }
    } else { wrong=true; b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble'); $('hint').textContent='👍 That one is fine!'; }
  });
}
/* ----------- rule match mini-game ----------- */
function matchGame(){
  $('sun').textContent='🧩'; const pairs=[['🏃','Running','Walk, two hands','🙌'],['📷','Photo, no asking','Ask first','🙋'],['🥤','Drink by laptop','Drinks away','🪑'],['🔞','Game 12+','Games for my age','👦']];
  let selL=null, done=0, tried={}; const right=pairs.map((p,i)=>[p[2],i,p[3]]).sort(()=>Math.random()-.5);
  show(`<div class="story"><b>🧩 Match!</b><br>👈 Tap a picture, then 👉 tap its rule</div><div class="mgrid"><div class="mcol" id="L">${pairs.map((p,i)=>`<div class="mc" data-i="${i}"><span class="em">${p[0]}</span>${esc(p[1])}</div>`).join('')}</div><div class="mcol" id="R">${right.map(r=>`<div class="mc" data-i="${r[1]}"><span class="em">${r[2]}</span>${esc(r[0])}</div>`).join('')}</div></div><div class="hint" id="hint"></div>`);
  document.querySelectorAll('#L .mc').forEach(c=>c.onclick=()=>{ document.querySelectorAll('#L .mc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); selL=c; $('hint').textContent=''; });
  document.querySelectorAll('#R .mc').forEach(c=>c.onclick=()=>{ if(!selL) { $('hint').textContent='👈 Tap a picture first'; return; }
    if(selL.dataset.i===c.dataset.i){ const i=selL.dataset.i; selL.classList.remove('sel'); selL.classList.add('done'); c.classList.add('done'); if(!tried[i]) score++; done++; selL=null; setProgress(); $('hint').textContent='✅ Yes!';
      if(done===4){ $('hint').innerHTML='🎉 All matched!<br><button class="btn green" id="nx">Next ▶</button>'; $('nx').onclick=next; } }
    else { tried[selL.dataset.i]=1; c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); $('hint').textContent='🔄 Try again!'; }
  });
}
/* ----------- finish ----------- */
function finish(){
  $('fill').style.width='100%'; $('sun').textContent='🌟'; $('sun').style.left='97%'; $('score').textContent=score;
  const uniq=[]; learned.forEach(l=>{ if(!uniq.find(u=>u[1]===l[1])) uniq.push(l); });
  const stars=score>=TOTAL*.85?'⭐⭐⭐':score>=TOTAL*.55?'⭐⭐':'⭐';
  show(`<div class="center"><div style="font-size:70px">🧒🐶🌙</div><div class="q" style="font-size:clamp(26px,5vw,38px)">🎉 Sam had a safe day! 🎉</div>
   <div class="story">📘 Pick <b>3 rules</b> 👆</div><div class="book" id="book">${uniq.map((u,i)=>`<div class="r" data-i="${i}"><span class="em">${u[0]}</span><span>${esc(u[1])}</span></div>`).join('')}</div>
   <button class="btn green" id="certBtn">Get my certificate 🏅</button></div>`);
  let picks=[]; document.querySelectorAll('#book .r').forEach(r=>r.onclick=()=>{ const i=+r.dataset.i; if(picks.includes(i)){ picks=picks.filter(x=>x!==i); r.classList.remove('pick'); } else if(picks.length<3){ picks.push(i); r.classList.add('pick'); } });
  $('certBtn').onclick=()=>{ const chosen=(picks.length?picks:[0,1,2]).map(i=>uniq[i]).filter(Boolean);
    show(`<div class="cert"><div style="font-size:54px">🏅</div><h2>Safe Tech Star</h2><div class="nm">${esc(studentName)}</div><div style="font-size:clamp(34px,7vw,52px)">${stars}</div><div style="font-weight:900;font-size:22px">${score} out of ${TOTAL}</div>
     <div style="font-weight:900;margin-top:10px;font-size:22px">📘 My rules</div><div class="book">${chosen.map(u=>`<div class="r"><span class="em">${u[0]}</span><span>${esc(u[1])}</span></div>`).join('')}</div></div>
     <div class="center"><div id="cloudNote" class="note"></div><button class="btn green" id="saveBtn">💾 Save My Results</button> <button class="btn" id="againBtn">Play again ↺</button><div id="savedNote" class="note"></div></div>`);
    const cn=$('cloudNote');
    if(window.__submitResultToCloud){ window.__submitResultToCloud({name:studentName,game:"Sam's Safe Tech Day (Y2)",score:score,total:TOTAL,date:new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}).then(ok=>{cn.textContent=ok?'☁️ Sent to your teacher automatically!':'⚠️ Could not connect to sync automatically. Use "Save My Results" below as a backup.';}); } else cn.textContent='⚠️ Cloud sync unavailable. Use "Save My Results" below as a backup.';
    $('againBtn').onclick=()=>location.reload();
    $('saveBtn').onclick=async()=>{ const now=new Date(); const safe=(studentName||'student').replace(/[^a-z0-9]+/gi,'_'); const fn=`SafeTechDay_Y2_${safe}_${now.toISOString().slice(0,10)}.csv`;
      const rows=[["Name","Score","Total","Date"],[studentName,score,TOTAL,now.toLocaleDateString()+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})]];
      await saveCSV(fn,rows,'savedNote'); };
  };
}
function csvEscape(v){ const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
async function saveCSV(filename,rows,noteId){
  const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  if(window.showSaveFilePicker){ try{ const hd=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'CSV file',accept:{'text/csv':['.csv']}}]}); const w=await hd.createWritable(); await w.write(csv); await w.close(); $(noteId).textContent='✅ Saved! Your results file was saved where you chose.'; return; }catch(err){ if(err&&err.name==='AbortError'){ $(noteId).textContent='Save cancelled.'; return; } } }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
  $(noteId).textContent='✅ Saved! A results file was downloaded.';
}
function start(){ const v=$('nameInput').value.trim(); if(!v){ $('nameErr').textContent='Please type your name to start.'; $('nameInput').focus(); return; }
  studentName=v.slice(0,24); $('gate').style.display='none'; $('app').classList.remove('hidden'); step=0; setProgress(); scene(S[0]); }
$('startBtn').onclick=start; $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); }); $('nameInput').focus();
</script>
