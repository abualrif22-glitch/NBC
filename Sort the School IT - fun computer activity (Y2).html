<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort the School IT! - Year 2 Computing Game</title>
<style>
  :root{
    --bgdark:#2B2250; --primary:#FF5C8A; --secondary:#3DDC97;
    --accent:#FFD23F; --violet:#6C63FF; --light:#F7F9FC; --dark:#1A1A2E; --red:#E74C3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; height:100%; touch-action:none; }
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:linear-gradient(135deg,#2B2250 0%,#6C63FF 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ background:var(--light); border-radius:26px; max-width:900px; width:100%; padding:26px 30px 34px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); position:relative; overflow:hidden; }
  h1{ color:var(--primary); text-align:center; margin:0 0 4px; font-size:clamp(24px,4vw,32px); }
  .sub{ text-align:center; color:#6B5B4A; margin:0 0 16px; font-size:clamp(13px,2vw,15px); }
  .hud{ display:flex; justify-content:space-between; align-items:center; background:white; border-radius:16px;
    padding:12px 20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:bold; color:var(--primary);
    flex-wrap:wrap; gap:8px; font-size:clamp(13px,2vw,16px); }
  .hud span.big{ color:var(--violet); font-size:1.2em; }

  .tray{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap; background:#FFF0F6; border:3px dashed #ffd2e3;
    border-radius:20px; padding:20px; margin-bottom:20px; min-height:120px; }
  .item{
    width:96px; height:96px; border-radius:18px; background:white; box-shadow:0 6px 16px rgba(0,0,0,0.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab;
    user-select:none; touch-action:none; transition:transform .1s ease;
  }
  .item .item-emoji{ font-size:38px; }
  .item .item-label{ font-size:10.5px; font-weight:bold; color:#555; margin-top:4px; text-align:center; padding:0 4px; }
  .item.dragging{ opacity:0.4; }
  .item.placed{ visibility:hidden; }

  .bins{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .bin{
    border-radius:20px; padding:18px 10px; text-align:center; min-height:150px; border:4px dashed transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  }
  .bin.work{ background:#E4EFFF; }
  .bin.talk{ background:#FFF0E0; }
  .bin.play{ background:#E4FBF6; }
  .bin-icon{ font-size:40px; margin-bottom:6px; }
  .bin-title{ font-weight:bold; font-size:16px; color:var(--dark); margin-bottom:10px; }
  .bin-slots{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .bin-slots .item{ width:50px; height:50px; box-shadow:0 3px 8px rgba(0,0,0,0.15); cursor:default; }
  .bin-slots .item .item-emoji{ font-size:22px; }
  .bin-slots .item .item-label{ display:none; }

  .msg{ text-align:center; margin-top:16px; min-height:34px; font-size:clamp(15px,2.3vw,18px); font-weight:bold; color:var(--primary); }
  .msg.happy{ color:#1a9e6b; } .msg.oops{ color:var(--red); }
  .controls{ display:flex; justify-content:center; margin-top:10px; gap:12px; }
  button.ctrl{ background:var(--primary); color:white; border:none; padding:13px 28px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.ctrl.secondary{ background:white; color:var(--primary); border:2px solid var(--primary); }

  .gate-overlay{ position:fixed; inset:0; background:rgba(43,34,80,0.75); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card{ background:white; border-radius:20px; padding:34px 36px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  .gate-card h2{ color:var(--primary); margin:0 0 8px; font-size:24px; }
  .gate-card p{ color:#555; margin:0 0 18px; font-size:14.5px; }
  .gate-card input{ width:100%; font-size:18px; padding:12px 14px; border-radius:10px; border:2px solid var(--secondary);
    text-align:center; font-weight:bold; color:var(--dark); margin-bottom:14px; box-sizing:border-box; }
  .gate-card button{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; }
  .gate-error{ color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; font-weight:bold; }
  #resultsPanel{ display:none; background:white; border-radius:14px; padding:18px 20px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  #resultsPanel h3{ margin:0 0 4px; color:var(--primary); font-size:18px; }
  .save-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .saved-note{ font-size:13px; color:#0e9e6f; font-weight:bold; min-height:18px; margin-top:8px; }
  .confetti-piece{ position:absolute; top:-20px; width:12px; height:16px; z-index:20; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(600px) rotate(540deg); opacity:0.2; } }
  .celebrate-banner{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) scale(0.5); background:white; border-radius:22px;
    padding:24px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.35); text-align:center; z-index:30; opacity:0; pointer-events:none; }
  .celebrate-banner.show{ animation: bannerPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bannerPop{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg);} 60%{opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg);} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);} }
  .celebrate-banner .big{ font-size:24px; font-weight:bold; color:var(--primary); }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>🗂️ Sort the School IT!</h2>
    <p>Type your name to start.</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
    <div class="gate-error" id="nameError"></div>
    <button id="startBtn">Start ▶</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <h1>🗂️ Sort the School IT!</h1>
  <p class="sub">Drag each piece of technology into the group it belongs to!</p>
  <div class="hud">
    <div>Player: <span class="big" id="playerName">—</span></div>
    <div>Sorted: <span class="big" id="sortedCount">0</span> / <span id="totalCount">9</span></div>
    <div>Tries: <span class="big" id="tryCount">0</span></div>
  </div>

  <div class="tray" id="tray"></div>

  <div class="bins">
    <div class="bin work" data-cat="work">
      <div class="bin-icon">💼</div>
      <div class="bin-title">Work</div>
      <div class="bin-slots" id="slots-work"></div>
    </div>
    <div class="bin talk" data-cat="talk">
      <div class="bin-icon">🗣️</div>
      <div class="bin-title">Talk</div>
      <div class="bin-slots" id="slots-talk"></div>
    </div>
    <div class="bin play" data-cat="play">
      <div class="bin-icon">🎮</div>
      <div class="bin-title">Play</div>
      <div class="bin-slots" id="slots-play"></div>
    </div>
  </div>

  <p class="msg" id="msg">Drag a device into the box it belongs in!</p>
  <div class="controls">
    <button class="ctrl secondary" id="resetBtn">⟲ Restart</button>
  </div>
</div>

<script>
// Each device has exactly ONE clear correct category — kept simple for Year 2.
const ITEMS = [
  {emoji:"\uD83D\uDDA5\uFE0F", label:"Computer", cat:"work"},
  {emoji:"\uD83D\uDDA8\uFE0F", label:"Printer", cat:"work"},
  {emoji:"\u2328\uFE0F", label:"Keyboard", cat:"work"},
  {emoji:"\u260E\uFE0F", label:"Telephone", cat:"talk"},
  {emoji:"\uD83D\uDCF1", label:"Smartphone", cat:"talk"},
  {emoji:"\uD83D\uDCFB", label:"Walkie-Talkie", cat:"talk"},
  {emoji:"\uD83C\uDFAE", label:"Games Console", cat:"play"},
  {emoji:"\uD83D\uDCF7", label:"Camera", cat:"play"},
  {emoji:"\uD83C\uDFA7", label:"Headphones", cat:"play"},
];

let studentName = "", tries = 0, wrongAttempts = 0, sortedCount = 0;
const STORAGE_KEY = "sortSchoolITResults";
const wrap = document.getElementById('wrap');
const msg = document.getElementById('msg');

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildTray(){
  tries = 0; wrongAttempts = 0; sortedCount = 0;
  document.getElementById('tryCount').textContent = 0;
  document.getElementById('sortedCount').textContent = 0;
  document.getElementById('totalCount').textContent = ITEMS.length;
  ['work','talk','play'].forEach(c => document.getElementById('slots-'+c).innerHTML = '');
  msg.className = 'msg';
  msg.textContent = 'Drag a device into the box it belongs in!';

  const shuffled = shuffle(ITEMS);
  const tray = document.getElementById('tray');
  tray.innerHTML = shuffled.map((it,i) => `
    <div class="item" data-cat="${it.cat}" id="item-${i}">
      <div class="item-emoji">${it.emoji}</div>
      <div class="item-label">${it.label}</div>
    </div>`).join('');
  attachDragHandlers();
}

function attachDragHandlers(){
  document.querySelectorAll('.item').forEach(item => {
    let dragging = false, offsetX=0, offsetY=0;

    function pointerDown(e){
      if(item.classList.contains('placed')) return;
      dragging = true;
      item.classList.add('dragging');
      const rect = item.getBoundingClientRect();
      const point = e.touches ? e.touches[0] : e;
      offsetX = point.clientX - rect.left; offsetY = point.clientY - rect.top;
      item.style.position = 'fixed'; item.style.zIndex = 1000;
      item.style.width = rect.width+'px'; item.style.height = rect.height+'px';
      movePiece(point);
      document.addEventListener('mousemove', pointerMove);
      document.addEventListener('touchmove', pointerMove, {passive:false});
      document.addEventListener('mouseup', pointerUp);
      document.addEventListener('touchend', pointerUp);
      e.preventDefault();
    }
    function movePiece(point){ item.style.left=(point.clientX-offsetX)+'px'; item.style.top=(point.clientY-offsetY)+'px'; }
    function pointerMove(e){ if(!dragging) return; movePiece(e.touches?e.touches[0]:e); e.preventDefault(); }
    function pointerUp(e){
      if(!dragging) return;
      dragging = false;
      item.classList.remove('dragging');
      document.removeEventListener('mousemove', pointerMove);
      document.removeEventListener('touchmove', pointerMove);
      document.removeEventListener('mouseup', pointerUp);
      document.removeEventListener('touchend', pointerUp);

      const point = e.changedTouches ? e.changedTouches[0] : e;
      const r = item.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      let landedBin = null;
      document.querySelectorAll('.bin').forEach(bin => {
        const br = bin.getBoundingClientRect();
        if(cx >= br.left && cx <= br.right && cy >= br.top && cy <= br.bottom) landedBin = bin;
      });

      item.style.position = ''; item.style.left=''; item.style.top=''; item.style.zIndex='';

      if(landedBin){
        tries++; document.getElementById('tryCount').textContent = tries;
        const cat = landedBin.dataset.cat;
        if(cat === item.dataset.cat){
          item.classList.add('placed');
          document.getElementById('slots-'+cat).appendChild(item);
          item.classList.remove('placed');
          sortedCount++;
          document.getElementById('sortedCount').textContent = sortedCount;
          spawnConfetti(14);
          msg.className = 'msg happy';
          msg.textContent = '✅ That\'s right!';
          if(sortedCount === ITEMS.length){
            setTimeout(showFinal, 500);
          }
        } else {
          msg.className = 'msg oops';
          msg.textContent = '❌ Not quite — try a different box!';
          wrongAttempts++;
        }
      }
    }
    item.addEventListener('mousedown', pointerDown);
    item.addEventListener('touchstart', pointerDown, {passive:false});
  });
}

function spawnConfetti(n){
  const colors=['#FF5C8A','#3DDC97','#FFD23F','#6C63FF','#2B2250','#FFFFFF'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'%'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.2+Math.random()*1.1)+'s';
    wrap.appendChild(p); setTimeout(()=>p.remove(),2500);
  }
}
function showCelebrateBanner(text, sub){
  const b=document.createElement('div'); b.className='celebrate-banner';
  b.innerHTML = `<div class="big">${text}</div><div style="font-size:14px;color:#555;">${sub||''}</div>`;
  wrap.appendChild(b); requestAnimationFrame(()=>b.classList.add('show'));
  setTimeout(()=>{ b.style.transition='opacity .3s'; b.style.opacity='0'; setTimeout(()=>b.remove(),320); },1300);
}

document.getElementById('resetBtn').addEventListener('click', buildTray);

function showFinal(){
  const accuracy = Math.max(0, Math.round(100 * (tries - wrongAttempts) / Math.max(tries,1)));
  spawnConfetti(40);
  showCelebrateBanner('🎉 All Sorted!', `Great job, ${studentName}!`);
  msg.className = 'msg happy';
  msg.textContent = `🏆 You sorted everything! Accuracy: ${accuracy}%`;
  showResultsPanel(accuracy);
  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: "Sort the School IT! (Y2)",
      score: accuracy,
      total: 100,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
  }
}
function showResultsPanel(accuracy){
  let panel = document.getElementById('resultsPanel');
  if(!panel){
    panel = document.createElement('div'); panel.id='resultsPanel';
    panel.innerHTML = `
      <h3>🏁 Well done!</h3>
      <div id="resultsSummary" style="font-size:14.5px;color:#444;"></div>
      <div class="save-row">
        <button class="ctrl" id="saveResultBtn">💾 Save My Results</button>
        <button class="ctrl secondary" id="downloadAllBtn">📋 Download Class Results</button>
      </div>
      <div class="saved-note" id="savedNote"></div>
      <div style="margin-top:14px;"><a href="index.html" style="display:inline-block; background:#1A1A2E; color:white; text-decoration:none; padding:12px 26px; border-radius:12px; font-weight:bold; font-size:14.5px;">🏠 Back to Hub</a></div>`;
    wrap.appendChild(panel);
    document.getElementById('saveResultBtn').addEventListener('click', onSaveResult);
    document.getElementById('downloadAllBtn').addEventListener('click', onDownloadAll);
  }
  panel.style.display = 'block';
  document.getElementById('resultsSummary').textContent = `${studentName} sorted all ${ITEMS.length} items with ${accuracy}% accuracy.`;
}
function readSavedResults(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch(e){ return []; } }
function writeSavedResults(list){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){} }
function csvEscape(v){ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function onSaveResult(){
  const accuracy = Math.max(0, Math.round(100 * (tries - wrongAttempts) / Math.max(tries,1)));
  const now = new Date();
  const record = { name:studentName, score:accuracy, total:100, date: now.toLocaleDateString()+' '+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
  const list = readSavedResults(); list.push(record); writeSavedResults(list);
  const safeName = (studentName||'student').replace(/[^a-z0-9]+/gi,'_');
  downloadCSV(`SortSchoolIT_${safeName}_${now.toISOString().slice(0,10)}.csv`, [["Name","Score","Total","Date"],[record.name,record.score,record.total,record.date]]);
  document.getElementById('savedNote').textContent = '✅ Saved! A results file was downloaded, and your score was stored on this computer.';
}
function onDownloadAll(){
  const list = readSavedResults();
  if(list.length===0){ document.getElementById('savedNote').textContent='No saved results yet on this computer.'; return; }
  const rows=[["Name","Score","Total","Date"], ...list.map(r=>[r.name,r.score,r.total,r.date])];
  downloadCSV(`SortSchoolIT_AllResults_${new Date().toISOString().slice(0,10)}.csv`, rows);
}

const gateOverlay = document.getElementById('gateOverlay');
const nameInput = document.getElementById('nameInput');
const nameError = document.getElementById('nameError');
function startGame(){
  const val = nameInput.value.trim();
  if(!val){ nameError.textContent="Please type your name to start."; nameInput.focus(); return; }
  studentName = val.slice(0,24);
  document.getElementById('playerName').textContent = studentName;
  gateOverlay.style.display = 'none';
  buildTray();
}
document.getElementById('startBtn').addEventListener('click', startGame);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });
nameInput.focus();
</script>

<!-- ===== Cloud sync: sends each result to the shared Firestore database ===== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCEJtHd802MyuZUlwt6OfGkl9IitHaSOaA",
    authDomain: "tasks-results.firebaseapp.com",
    projectId: "tasks-results",
    storageBucket: "tasks-results.firebasestorage.app",
    messagingSenderId: "1014525306500",
    appId: "1:1014525306500:web:3ffe2e6f5554e9140e04d1"
  };
  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    window.__submitResultToCloud = function(record){
      return db.collection("results").add({
        ...record,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => true).catch((err) => { console.error("Cloud sync failed:", err); return false; });
    };
  }catch(err){
    console.error("Firebase init failed:", err);
  }
</script>
</body>
</html>
