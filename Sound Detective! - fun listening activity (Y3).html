<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Detective! - Year 3 Computing Game</title>
<style>
  :root{
    --primary:#4338CA; --secondary:#EC4899; --accent:#FACC15;
    --light:#F5F3FF; --dark:#211A42; --red:#E74C3C; --green:#06D6A0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:linear-gradient(135deg,#4338CA 0%,#EC4899 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ background:var(--light); border-radius:26px; max-width:880px; width:100%; padding:26px 30px 34px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); position:relative; overflow:hidden; }
  h1{ color:var(--primary); text-align:center; margin:0 0 4px; font-size:clamp(24px,4vw,32px); }
  .sub{ text-align:center; color:#555; margin:0 0 10px; font-size:clamp(13px,2vw,15px); }
  .headphone-note{ text-align:center; font-size:13.5px; color:#9333ea; font-weight:bold; margin:0 0 16px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; background:white; border-radius:16px;
    padding:12px 20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:bold; color:var(--primary);
    flex-wrap:wrap; gap:8px; font-size:clamp(12px,2vw,15px); }
  .hud span.big{ color:var(--secondary); font-size:1.2em; }

  .stage{ background:#F0ECFF; border-radius:22px; padding:28px 22px; text-align:center; border:3px dashed #D6C9FA;
    min-height:360px; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  .q-icon{ font-size:52px; margin-bottom:8px; }
  .q-title{ color:var(--primary); font-weight:bold; font-size:clamp(17px,3vw,22px); margin-bottom:6px; }
  .q-hint{ color:#555; font-size:14px; margin-bottom:18px; max-width:460px; }

  .sound-btn{ background:var(--primary); color:white; border:none; border-radius:50px; padding:18px 36px;
    font-size:clamp(16px,3vw,20px); font-weight:bold; cursor:pointer; box-shadow:0 8px 0 #2c2496, 0 10px 20px rgba(0,0,0,0.2);
    margin-bottom:24px; transition: transform .08s ease; }
  .sound-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #2c2496, 0 4px 10px rgba(0,0,0,0.2); }
  .sound-btn.playing{ animation: soundPulse .5s ease infinite; }
  @keyframes soundPulse{ 0%,100%{ box-shadow:0 8px 0 #2c2496, 0 10px 20px rgba(0,0,0,0.2), 0 0 0 0 rgba(67,56,202,0.5);} 50%{ box-shadow:0 8px 0 #2c2496, 0 10px 20px rgba(0,0,0,0.2), 0 0 0 14px rgba(67,56,202,0);} }

  .device-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:460px; }
  .device-btn{ background:white; border:3px solid #D6C9FA; border-radius:16px; padding:16px 10px; cursor:pointer;
    font-weight:bold; color:var(--dark); font-size:clamp(13px,2.3vw,15.5px); display:flex; flex-direction:column;
    align-items:center; gap:6px; transition: transform .08s ease, border-color .15s ease; }
  .device-btn .demoji{ font-size:34px; }
  .device-btn:active{ transform:scale(0.96); }
  .device-btn:disabled{ opacity:0.6; }
  .device-btn.correct{ border-color:var(--green); background:#E8FFF7; animation:popGood .4s ease; }
  .device-btn.wrong{ border-color:var(--red); background:#FFEDEA; animation:shakeRed .4s ease; }
  @keyframes popGood{ 0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);} }
  @keyframes shakeRed{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .explain-box{ background:white; border-radius:16px; padding:16px 20px; margin-top:18px; max-width:520px; box-shadow:0 4px 14px rgba(0,0,0,0.1); text-align:left; }
  .explain-box .verdict{ font-weight:bold; font-size:15.5px; margin-bottom:6px; }
  .explain-box .verdict.happy{ color:#0e9e6f; } .explain-box .verdict.oops{ color:var(--red); }
  .classify-badge{ display:inline-block; padding:4px 14px; border-radius:20px; font-weight:bold; font-size:13px; color:white; margin-bottom:8px; }
  .classify-badge.Input{ background:#2563EB; }
  .classify-badge.Output{ background:#EA580C; }
  .classify-badge.Both{ background:#7C3AED; }
  .explain-box p{ margin:0; color:#444; font-size:14px; line-height:1.4; }

  .msg{ text-align:center; margin-top:14px; min-height:26px; font-size:clamp(13px,2.1vw,15px); font-weight:bold; color:var(--primary); }
  .controls{ display:flex; justify-content:center; margin-top:16px; gap:12px; }
  button.ctrl{ background:var(--primary); color:white; border:none; padding:13px 28px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  button.ctrl.secondary{ background:white; color:var(--primary); border:2px solid var(--primary); }

  .gate-overlay{ position:fixed; inset:0; background:rgba(33,26,66,0.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card{ background:white; border-radius:20px; padding:34px 36px; max-width:430px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  .gate-card h2{ color:var(--primary); margin:0 0 8px; font-size:24px; }
  .gate-card p{ color:#555; margin:0 0 16px; font-size:14.5px; }
  .gate-card input{ width:100%; font-size:18px; padding:12px 14px; border-radius:10px; border:2px solid var(--secondary);
    text-align:center; font-weight:bold; color:var(--dark); margin-bottom:14px; box-sizing:border-box; }
  .gate-card input:focus{ outline:none; border-color:var(--primary); }
  .gate-card button{ width:100%; padding:13px; font-size:16px; border:none; border-radius:10px; background:var(--primary); color:white; font-weight:bold; cursor:pointer; margin-top:8px; }
  .gate-card button.test-sound{ background:white; color:var(--primary); border:2px solid var(--primary); margin-top:0; margin-bottom:14px; }
  .gate-error{ color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; font-weight:bold; }

  #resultsPanel{ display:none; background:white; border-radius:14px; padding:18px 20px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  #resultsPanel h3{ margin:0 0 4px; color:var(--primary); font-size:18px; }
  #resultsPanel .save-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  #resultsPanel .saved-note{ font-size:13px; color:#0e9e6f; font-weight:bold; min-height:18px; margin-top:8px; }
  #savedTableWrap{ margin-top:14px; max-height:220px; overflow:auto; display:none; }
  #savedTableWrap table{ width:100%; border-collapse:collapse; font-size:13px; }
  #savedTableWrap th, #savedTableWrap td{ padding:6px 8px; border-bottom:1px solid #e3e6f0; text-align:left; }
  #savedTableWrap th{ color:var(--primary); }

  .confetti-piece{ position:absolute; top:-20px; width:12px; height:16px; z-index:20; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(600px) rotate(540deg); opacity:0.2; } }
  .celebrate-banner{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) scale(0.5); background:white; border-radius:22px;
    padding:24px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.35); text-align:center; z-index:30; opacity:0; pointer-events:none; }
  .celebrate-banner.show{ animation: bannerPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bannerPop{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg);} 60%{opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg);} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);} }
  .celebrate-banner .big{ font-size:24px; font-weight:bold; color:var(--primary); }
  .final-screen{ text-align:center; }
  .final-screen .trophy{ font-size:76px; }
  .top-bar{ margin:0; }
  .hub-top-btn{ position:fixed; top:12px; left:12px; z-index:300;
    display:inline-flex; align-items:center; gap:6px; background:#1A1A2E; color:white;
    text-decoration:none; font-weight:bold; font-size:clamp(12px,2.2vw,14px); padding:8px 16px 8px 12px;
    border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,0.35); }
  .hub-top-btn:hover{ opacity:0.85; }
  .hub-top-btn:active{ transform:scale(0.96); }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <h2>🎧 Sound Detective!</h2>
    <p>Put on your headphones, then test the sound below before you start!</p>
    <button class="test-sound" id="testSoundBtn">🔊 Test My Headphones</button>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24" autocomplete="off">
    <div class="gate-error" id="nameError"></div>
    <button id="startBtn">Start ▶</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="top-bar"><a href="index.html" class="hub-top-btn">🏠 Back to Hub</a></div>
  <h1>🎧 Sound Detective!</h1>
  <p class="sub" id="subline">Listen carefully, then guess which digital device makes each sound!</p>
  <p class="headphone-note">🎧 Remember to wear your headphones!</p>

  <div class="hud">
    <div>Player: <span class="big" id="playerName">—</span></div>
    <div>Round <span class="big" id="roundNum">1</span>/<span id="roundTotal">8</span></div>
    <div>Score: <span class="big" id="score">0</span> ⭐</div>
  </div>

  <div class="stage" id="stage"><!-- filled by JS --></div>

  <p class="msg" id="msg"></p>
</div>

<script>
// ===================== AUDIO (synthesized — no external sound files needed) =====================
function getCtx(){
  if(!window.__audioCtx){
    window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(window.__audioCtx.state === 'suspended') window.__audioCtx.resume();
  return window.__audioCtx;
}
function tone(ctx, freq, start, dur, type, gainVal){
  type = type || 'sine'; gainVal = gainVal===undefined ? 0.22 : gainVal;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime+start);
  gain.gain.linearRampToValueAtTime(gainVal, ctx.currentTime+start+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.03);
}
function click(ctx, start, dur, gainVal){
  dur = dur || 0.035; gainVal = gainVal===undefined ? 0.35 : gainVal;
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const gain = ctx.createGain(); gain.gain.value = gainVal;
  src.connect(gain); gain.connect(ctx.destination);
  src.start(ctx.currentTime+start);
}

const SOUNDS = {
  keyboard: (ctx)=>{ for(let i=0;i<6;i++) click(ctx, i*0.13, 0.03, 0.3); },
  shutter:  (ctx)=>{ click(ctx, 0, 0.02, 0.4); click(ctx, 0.07, 0.015, 0.3); },
  printer:  (ctx)=>{ for(let i=0;i<5;i++) tone(ctx, 170+i*6, i*0.14, 0.1, 'sawtooth', 0.12); },
  chime:    (ctx)=>{ tone(ctx,523,0,0.22,'sine',0.2); tone(ctx,659,0.2,0.22,'sine',0.2); tone(ctx,784,0.4,0.3,'sine',0.2); },
  startup:  (ctx)=>{ [392,523,659,784].forEach((f,i)=> tone(ctx,f,i*0.11,0.16,'triangle',0.2)); },
  mic:      (ctx)=>{ tone(ctx,440,0,0.16,'sine',0.2); tone(ctx,880,0.28,0.14,'sine',0.18); },
  scanner:  (ctx)=>{ tone(ctx,1000,0,0.09,'square',0.12); tone(ctx,1300,0.12,0.09,'square',0.12); },
  watch:    (ctx)=>{ tone(ctx,800,0,0.08,'sine',0.2); tone(ctx,800,0.14,0.08,'sine',0.2); },
};

// ===================== CONTENT =====================
// Ties into the Year 3 "How Does a Digital Device Work?" unit — each device is
// classified as Input, Output, or Both, just like the Input or Output? game, but this
// time learners identify the device by SOUND first (headphones on!).
const ROUNDS = [
  { id:'keyboard', emoji:'⌨️', name:'Keyboard', sound:'keyboard', classify:'Input',
    explain:"A keyboard sends your key presses INTO the computer — that's an input device." },
  { id:'camera', emoji:'📷', name:'Digital Camera', sound:'shutter', classify:'Input',
    explain:"A camera captures a photo and sends it INTO the device to be saved — that's input." },
  { id:'printer', emoji:'🖨️', name:'Printer', sound:'printer', classify:'Output',
    explain:"A printer takes information FROM the computer and puts it onto paper — that's output." },
  { id:'speaker', emoji:'🔊', name:'Smart Speaker', sound:'chime', classify:'Output',
    explain:"A smart speaker plays sound OUT for you to hear — that's output." },
  { id:'console', emoji:'🎮', name:'Games Console', sound:'startup', classify:'Both',
    explain:"A games console takes your button presses (input) AND shows the game on screen (output) — it's both!" },
  { id:'mic', emoji:'🎙️', name:'Microphone', sound:'mic', classify:'Input',
    explain:"A microphone takes in sound and sends it INTO the device to be recorded — that's input." },
  { id:'scanner', emoji:'🔍', name:'Barcode Scanner', sound:'scanner', classify:'Input',
    explain:"A barcode scanner reads a barcode and sends the information INTO the till — that's input." },
  { id:'watch', emoji:'⌚', name:'Smartwatch', sound:'watch', classify:'Both',
    explain:"A smartwatch takes input (your taps, your steps) AND gives output (the time, a buzz) — it's both!" },
];

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let roundIdx = 0, score = 0, answered = false, studentName = "";
const STORAGE_KEY = "soundDetectiveResults";

const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const wrap = document.getElementById('wrap');
document.getElementById('roundTotal').textContent = ROUNDS.length;

function updateHUD(){
  document.getElementById('roundNum').textContent = roundIdx+1;
  document.getElementById('score').textContent = score;
}

function playSound(id){
  try{
    const ctx = getCtx();
    (SOUNDS[id] || SOUNDS.keyboard)(ctx);
  }catch(e){ console.error('Audio failed', e); }
}

function renderRound(){
  answered = false;
  const item = ROUNDS[roundIdx];
  updateHUD();
  msg.className = 'msg';
  msg.textContent = '';

  const distractors = shuffle(ROUNDS.filter(r=>r.id!==item.id)).slice(0,3);
  const options = shuffle([item, ...distractors]);

  stage.innerHTML = `
    <div class="q-icon">🔊</div>
    <div class="q-title">Round ${roundIdx+1}: What Made That Sound?</div>
    <div class="q-hint">Tap "Play Sound" (as many times as you like), then pick the matching device.</div>
    <button class="sound-btn" id="playBtn">▶ Play Sound</button>
    <div class="device-grid" id="deviceGrid">
      ${options.map(o=>`<button class="device-btn" data-id="${o.id}"><span class="demoji">${o.emoji}</span>${o.name}</button>`).join('')}
    </div>
    <div id="explainArea"></div>
  `;

  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', ()=>{
    playSound(item.sound);
    playBtn.classList.add('playing');
    setTimeout(()=>playBtn.classList.remove('playing'), 900);
  });

  stage.querySelectorAll('.device-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> handleAnswer(btn.dataset.id, btn, item));
  });

  // auto-play once so the round starts with a sound
  setTimeout(()=>{ playSound(item.sound); playBtn.classList.add('playing'); setTimeout(()=>playBtn.classList.remove('playing'),900); }, 300);
}

const PRAISE = ["Great ears! 🎧","Nice detective work! 🔍","Spot on! ⭐","You got it! 🎉","Well spotted! 👏","Super listening! 🌟"];

function handleAnswer(chosenId, btnEl, item){
  if(answered) return;
  answered = true;
  const correct = chosenId === item.id;
  stage.querySelectorAll('.device-btn').forEach(b=>{
    b.disabled = true;
    if(b.dataset.id === item.id) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
  });

  if(correct){
    score += 10;
    document.getElementById('score').textContent = score;
    spawnConfetti(20);
    showCelebrateBanner(PRAISE[Math.floor(Math.random()*PRAISE.length)], '+10 points');
  }

  const verdictClass = correct ? 'happy' : 'oops';
  const verdictText = correct ? '✅ Correct!' : `❌ Not quite — it was the ${item.emoji} ${item.name}.`;
  document.getElementById('explainArea').innerHTML = `
    <div class="explain-box">
      <div class="verdict ${verdictClass}">${verdictText}</div>
      <span class="classify-badge ${item.classify}">${item.classify}</span>
      <p>${item.explain}</p>
    </div>
    <div class="controls"><button class="ctrl" id="nextBtn">${roundIdx < ROUNDS.length-1 ? 'Next Round ▶' : 'See My Results 🏁'}</button></div>
  `;
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    roundIdx++;
    if(roundIdx < ROUNDS.length){ renderRound(); } else { showFinal(); }
  });
}

function spawnConfetti(n){
  const colors = ['#4338CA','#EC4899','#FACC15','#06D6A0','#FFFFFF'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + '%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.2 + Math.random()*1.1) + 's';
    wrap.appendChild(p);
    setTimeout(()=>p.remove(), 2500);
  }
}
function showCelebrateBanner(text, sub){
  const b = document.createElement('div');
  b.className = 'celebrate-banner';
  b.innerHTML = `<div class="big">${text}</div><div style="font-size:14px;color:#555;">${sub}</div>`;
  wrap.appendChild(b);
  requestAnimationFrame(()=> b.classList.add('show'));
  setTimeout(()=>{ b.style.transition='opacity .3s'; b.style.opacity='0'; setTimeout(()=>b.remove(),320); }, 1100);
}

function showFinal(){
  const total = ROUNDS.length*10;
  let stars = "⭐";
  const pct = score/total;
  if(pct>=0.9) stars="⭐⭐⭐";
  else if(pct>=0.6) stars="⭐⭐";

  stage.innerHTML = `
    <div class="final-screen">
      <div class="trophy">🏆</div>
      <div style="font-size:34px;">${stars}</div>
      <div style="font-size:22px;font-weight:bold;color:var(--primary);margin-bottom:8px;">You're a Sound Detective!</div>
      <div style="font-size:17px;color:#555;margin-bottom:18px;">Final score: ${score} / ${total}</div>
      <div class="controls">
        <button class="ctrl secondary" id="playAgainBtn">Play Again 🔄</button>
      </div>
    </div>`;
  msg.textContent = "";
  spawnConfetti(50);
  document.getElementById('playAgainBtn').addEventListener('click', ()=>{
    roundIdx = 0; score = 0;
    document.getElementById('score').textContent = score;
    renderRound();
  });
  showResultsPanel();
}

/* ================= RESULTS PANEL ================= */
function showResultsPanel(){
  let panel = document.getElementById('resultsPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'resultsPanel';
    panel.innerHTML = `
      <h3>🏁 Well done!</h3>
      <div id="resultsSummary" style="font-size:14.5px;color:#444;"></div>
      <div class="saved-note" id="cloudSyncNote" style="color:#4338CA;">☁️ Sending your result to your teacher...</div>
      <div class="save-row">
        <button class="ctrl" id="saveResultBtn">💾 Save My Results</button>
        <button class="ctrl secondary" id="downloadAllBtn">📋 Download Class Results</button>
        <button class="ctrl secondary" id="toggleSavedBtn">👀 View Saved Results</button>
      </div>
      <div class="saved-note" id="savedNote"></div>
      <div style="margin-top:14px;"><a href="index.html" style="display:block; background:#1A1A2E; color:white; text-decoration:none; padding:20px 24px; border-radius:16px; font-weight:bold; font-size:22px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.3);">🏠 Back to Hub</a></div>
      <div id="savedTableWrap">
        <table>
          <thead><tr><th>Name</th><th>Score</th><th>Total</th><th>Date</th></tr></thead>
          <tbody id="savedTableBody"></tbody>
        </table>
      </div>`;
    wrap.appendChild(panel);
    document.getElementById('saveResultBtn').addEventListener('click', onSaveResult);
    document.getElementById('downloadAllBtn').addEventListener('click', onDownloadAll);
    document.getElementById('toggleSavedBtn').addEventListener('click', onToggleSaved);
  }
  panel.style.display = 'block';
  document.getElementById('resultsSummary').textContent = `${studentName} scored ${score} out of ${ROUNDS.length*10}.`;
  document.getElementById('savedNote').textContent = '';
  panel.scrollIntoView({ behavior:'smooth', block:'nearest' });

  const cloudNote = document.getElementById('cloudSyncNote');
  if(window.__submitResultToCloud){
    window.__submitResultToCloud({
      name: studentName,
      game: "Sound Detective! (Y3)",
      score: score,
      total: ROUNDS.length*10,
      date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    }).then(ok => {
      if(cloudNote) cloudNote.textContent = ok
        ? '☁️ Sent to your teacher automatically!'
        : '⚠️ Could not connect to sync automatically — use "Save My Results" below as a backup.';
    });
  } else if(cloudNote){
    cloudNote.textContent = '⚠️ Cloud sync unavailable — use "Save My Results" below as a backup.';
  }
}

function readSavedResults(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }catch(e){ return []; } }
function writeSavedResults(list){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){} }
function csvEscape(v){ const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function renderSavedTable(){
  const list = readSavedResults();
  const body = document.getElementById('savedTableBody');
  body.innerHTML = list.map(r=>`<tr><td>${r.name}</td><td>${r.score}</td><td>${r.total}</td><td>${r.date}</td></tr>`).join('') ||
    '<tr><td colspan="4" style="color:#999;">No saved results yet on this computer.</td></tr>';
}
async function saveCSVWithPicker(filename, rows, noteElId, chosenMsg, fallbackMsg, cancelMsg){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'CSV file', accept: {'text/csv': ['.csv']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(csv);
      await writable.close();
      document.getElementById(noteElId).textContent = chosenMsg;
      return;
    }catch(err){
      if(err && err.name === 'AbortError'){
        document.getElementById(noteElId).textContent = cancelMsg;
        return;
      }
    }
  }
  downloadCSV(filename, rows);
  document.getElementById(noteElId).textContent = fallbackMsg;
}
async function onSaveResult(){
  const now = new Date();
  const record = {
    name: studentName, score: score, total: ROUNDS.length*10,
    date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  };
  const list = readSavedResults();
  list.push(record);
  writeSavedResults(list);
  const safeName = (studentName || 'student').replace(/[^a-z0-9]+/gi,'_');
  const filename = `SoundDetective_${safeName}_${now.toISOString().slice(0,10)}.csv`;
  const rows = [["Name","Score","Total","Date"], [record.name, record.score, record.total, record.date]];
  await saveCSVWithPicker(filename, rows, 'savedNote',
    '✅ Saved! Your results file was saved where you chose, and your score was stored on this computer.',
    '✅ Saved! A results file was downloaded (this browser doesn’t support choosing a save location), and your score was stored on this computer.',
    'Save cancelled — your score is still stored on this computer, so you can still download the class results later.');
  renderSavedTable();
}
async function onDownloadAll(){
  const list = readSavedResults();
  if(list.length === 0){
    document.getElementById('savedNote').textContent = 'No saved results yet on this computer.';
    return;
  }
  const rows = [["Name","Score","Total","Date"], ...list.map(r=>[r.name, r.score, r.total, r.date])];
  const filename = `SoundDetective_AllResults_${new Date().toISOString().slice(0,10)}.csv`;
  await saveCSVWithPicker(filename, rows, 'savedNote',
    '✅ Class results saved where you chose.',
    '✅ Class results file downloaded (this browser doesn’t support choosing a save location).',
    'Save cancelled.');
}
function onToggleSaved(){
  const t = document.getElementById('savedTableWrap');
  const showing = t.style.display === 'block';
  t.style.display = showing ? 'none' : 'block';
  if(!showing) renderSavedTable();
}
