<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tablet Master Quest! - Year 1 Revision Game</title>
<style>
  :root{ --primary:#FF7F50; --secondary:#4FC3F7; --accent:#FFD54F; --green:#4CAF50; --light:#FFF9F0; --dark:#2B2250; --red:#E85C4A; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; min-height:100%; overscroll-behavior:none;}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif; background:linear-gradient(135deg,#FF7F50 0%,#FFD54F 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:14px; color:var(--dark);}
  .wrap{background:var(--light); border-radius:26px; max-width:720px; width:100%; padding:18px 22px 24px; box-shadow:0 20px 50px rgba(0,0,0,.3); position:relative; overflow:hidden;}
  .hub-top-btn{position:fixed; top:10px; left:10px; z-index:300; background:#1A1A2E; color:#fff; text-decoration:none; font-weight:bold; font-size:14px; padding:8px 16px 8px 12px; border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,.35);}
  h1{margin:6px 0 2px; text-align:center; color:var(--primary); font-size:clamp(24px,5vw,32px);}
  .pills{display:flex; gap:6px; justify-content:center; margin:8px 0 10px;}
  .pill{width:40px; height:40px; border-radius:50%; background:#EADFCB; display:flex; align-items:center; justify-content:center; font-size:20px; transition:.3s;}
  .pill.cur{background:var(--secondary); transform:scale(1.15); box-shadow:0 3px 8px rgba(0,0,0,.2);}
  .pill.done{background:var(--green);}
  .stars{text-align:center; font-size:22px; letter-spacing:2px; min-height:28px;}
  .bar{height:12px; background:#EADFCB; border-radius:8px; overflow:hidden; margin:6px 0 12px;}
  .bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .4s;}
  .prompt{display:flex; align-items:center; justify-content:center; gap:14px; background:#fff; border-radius:18px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:12px; min-height:84px;}
  .prompt .pe{font-size:56px; line-height:1;}
  .prompt .pt{font-size:clamp(20px,4vw,28px); font-weight:800; color:var(--dark);}
  .prompt:empty{display:none;}
  .stage{position:relative; background:#FFF0E0; border:4px dashed #FFD2B0; border-radius:24px; min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; touch-action:manipulation;}
  .big{font-size:110px; line-height:1; filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));}
  .row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px; width:100%;}
  .btn{flex:1; min-width:140px; max-width:300px; padding:16px 12px; border-radius:20px; border:5px solid transparent; font-size:22px; font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; background:#fff; color:var(--dark); box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .btn .ic{font-size:54px; line-height:1;}
  .btn:active{transform:translateY(3px); box-shadow:none;}
  .btn.yes{background:#E8F7E4; border-color:#8BC34A;}
  .btn.no{background:#FDE8E4; border-color:#F2998B;}
  .btn.ok{background:#C8F0C0; border-color:var(--green);}
  .btn.bad{animation:shake .4s; border-color:var(--red);}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shake{animation:shake .4s;}
  .msg{text-align:center; min-height:34px; margin:10px 0 0; font-size:22px; font-weight:800; color:var(--primary);}
  .overlay{position:fixed; inset:0; background:rgba(43,34,80,.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .card{background:#fff; border-radius:24px; padding:30px 30px; max-width:460px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .card h2{margin:6px 0 6px; color:var(--primary); font-size:28px;}
  .card p{color:#555; font-size:18px; margin:0 0 16px;}
  .card .em{font-size:84px; line-height:1;}
  .go{width:100%; padding:16px; border:none; border-radius:16px; background:var(--primary); color:#fff; font-size:22px; font-weight:800; cursor:pointer; box-shadow:0 5px 0 #d5603a;}
  .go:active{transform:translateY(4px); box-shadow:none;}
  /* tablet svg */
  svg.tab{width:min(300px,70%); height:auto; touch-action:manipulation;}
  .hot{cursor:pointer;}
  /* touch tasks */
  .abs{position:absolute; line-height:1; font-size:70px; cursor:pointer; transition:transform .15s;}
  .pop{animation:pop .35s forwards;}
  @keyframes pop{to{transform:scale(1.7); opacity:0;}}
  .basket{position:absolute; right:22px; bottom:22px; font-size:110px; line-height:1;}
  .drag{position:absolute; font-size:84px; line-height:1; touch-action:none; cursor:grab; z-index:5;}
  canvas#draw{background:#fff; border-radius:18px; touch-action:none; width:100%; height:260px; border:3px solid #FFD2B0;}
  /* keyboard */
  .slots{display:flex; gap:10px; justify-content:center; margin:6px 0 10px; flex-wrap:wrap;}
  .slot{width:62px; height:76px; border-radius:14px; border:4px solid #FFD2B0; background:#fff; font-size:46px; font-weight:800; display:flex; align-items:center; justify-content:center; color:var(--dark);}
  .slot.ghost{color:#E6D9C2;}
  .kb{background:#2F3140; border-radius:18px; padding:8px; width:100%; max-width:660px; margin-top:8px;}
  .kr{display:flex; gap:5px; justify-content:center; margin-bottom:5px;}
  .key{flex:1; max-width:56px; height:52px; border-radius:9px; border:none; background:#555a70; color:#fff; font-size:22px; font-weight:700; cursor:pointer;}
  .key:active{background:#7a80a0;}
  .key.wide{max-width:110px; background:#6d7390; font-size:20px;}
  .key.go2{background:var(--green); max-width:110px;}
  .typed{min-height:76px; min-width:240px; background:#fff; border:4px solid var(--secondary); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:800; padding:0 14px; letter-spacing:4px;}
  /* edit cursor */
  .line{display:flex; align-items:center; justify-content:center; min-height:90px; background:#fff; border:4px solid var(--secondary); border-radius:14px; padding:6px 10px;}
  .ch{font-size:50px; font-weight:800; padding:0 4px; line-height:1.2;}
  .gap{width:26px; height:76px; border-radius:6px; cursor:pointer; position:relative;}
  .gap.cur::after{content:''; position:absolute; left:11px; top:8px; bottom:8px; width:5px; background:var(--primary); animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .hint{font-size:17px; color:#8a7766; text-align:center; margin-top:6px; font-weight:600;}
  .conf{position:fixed; top:-20px; font-size:28px; z-index:400; pointer-events:none; animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
  .lock{position:relative;}
</style>
</head>
<body>
<a class="hub-top-btn" href="index.html">🏠 Back to Hub</a>

<div class="overlay" id="gate"><div class="card">
  <div class="em">📱</div>
  <h2>Tablet Master Quest!</h2>
  <p>Show what you know about tablets. Use your finger!</p>
  <button class="go" id="startBtn">Tap to Start! ▶</button>
</div></div>

<div class="wrap" id="wrap">
  <h1>📱 Tablet Master Quest!</h1>
  <div class="pills" id="pills"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="stars" id="stars"></div>
  <div class="prompt" id="prompt"></div>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), promptEl=$('prompt'), msgEl=$('msg');
let L=0, T=0, points=0, firstTry=0, totalTasks=0, mistakes=0, doneCount=0;
function say(t){ msgEl.textContent=t||''; }
function setPrompt(e,t){ promptEl.innerHTML=`<span class="pe">${e}</span><span class="pt">${t}</span>`; }
function clear(){ stage.innerHTML=''; say(''); }
function mk(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function bad(el){ mistakes++; if(el){ el.classList.remove('bad','shake'); void el.offsetWidth; el.classList.add(el.classList.contains('btn')?'bad':'shake'); } say('Try again! 💪'); }
function good(){ say(['Well done! ⭐','Super! 🌟','Yes! 🎉','Great tapping! 👏','Brilliant! ✨'][Math.floor(Math.random()*5)]); }
function confetti(n){ const E=['🎉','⭐','🌟','🎈','✨']; for(let i=0;i<n;i++){ const c=mk('div','conf',E[i%E.length]); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*.8)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200);} }

/* ---------- generic tasks ---------- */
function pickTask(pe,pt,opts,big){ return done=>{ clear(); setPrompt(pe,pt); if(big) stage.appendChild(mk('div','big',big)); const row=mk('div','row'); let slipped=false;
  opts.forEach(o=>{ const b=mk('button','btn '+(o.cls||''),`<span class="ic">${o.e}</span>${o.t||''}`); b.onclick=()=>{ if(o.ok){ b.classList.add('ok'); good(); [...row.children].forEach(x=>x.onclick=null); setTimeout(()=>done(!slipped),900);} else { slipped=true; bad(b);} }; row.appendChild(b); }); stage.appendChild(row); }; }
const sortTask=(e,label,tech)=>pickTask('🤔','Is it technology?',[{e:'⚙️',t:'Technology',cls:'yes',ok:tech},{e:'🌳',t:'Not technology',cls:'no',ok:!tech}],e+`<div style="font-size:26px;font-weight:800;margin-top:6px">${label}</div>`.replace(/^/,''));
function sort2(e,label,tech){ return done=>{ pickTask('🤔','Is it technology?',[{e:'⚙️',t:'Technology',cls:'yes',ok:tech},{e:'🌳',t:'Not technology',cls:'no',ok:!tech}],e)(done); const l=mk('div','',label); l.style.cssText='font-size:26px;font-weight:800;margin-top:4px'; stage.insertBefore(l,stage.querySelector('.row')); }; }

/* tablet parts */
function tabSVG(on){ return `<svg class="tab" viewBox="0 0 220 300">
 <rect id="pwr" class="hot" x="168" y="-4" width="46" height="16" rx="6" transform="translate(0,6)" fill="#9aa0b8" stroke="#2B2250" stroke-width="3"/>
 <rect x="12" y="20" width="196" height="270" rx="22" fill="#2B2250"/>
 <rect id="scr" class="hot" x="26" y="52" width="168" height="196" rx="8" fill="${on?'#BFE3FF':'#16192a'}"/>
 <circle id="cam" class="hot" cx="110" cy="36" r="8" fill="#4FC3F7" stroke="#fff" stroke-width="2"/>
 <g id="spk" class="hot"><rect x="70" y="262" width="80" height="14" rx="7" fill="#555a70"/><line x1="82" y1="269" x2="138" y2="269" stroke="#9aa0b8" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round"/></g>
</svg>`; }
const partTask=(e,name,id)=>done=>{ clear(); setPrompt(e,'Tap the '+name+'!'); const w=mk('div','',tabSVG(true)); stage.appendChild(w); let slipped=false;
  ['pwr','scr','cam','spk'].forEach(k=>{ const el=w.querySelector('#'+k); el.onclick=()=>{ if(k===id){ el.style.filter='drop-shadow(0 0 8px #FFD54F)'; el.setAttribute('stroke','#4CAF50'); el.setAttribute('stroke-width','5'); good(); ['pwr','scr','cam','spk'].forEach(j=>w.querySelector('#'+j).onclick=null); setTimeout(()=>done(!slipped),900);} else { slipped=true; bad(w.querySelector('svg')); } }; }); };
const switchOn=done=>{ clear(); setPrompt('⏻','Switch it on!'); const w=mk('div','',tabSVG(false)); stage.appendChild(w); let step=0, slipped=false; say('1. Tap the power button');
  const scr=w.querySelector('#scr'), pw=w.querySelector('#pwr');
  pw.onclick=()=>{ if(step!==0){return;} step=1; scr.setAttribute('fill','#3d4a8a'); const t=mk('div','', '🔒 Swipe up!'); t.style.cssText='position:absolute;left:0;right:0;top:46%;text-align:center;font-size:28px;font-weight:800;color:#fff;pointer-events:none'; w.style.position='relative'; w.appendChild(t); w._t=t; say('2. Swipe up on the screen with your finger ☝️');
    let y0=null; scr.style.touchAction='none'; scr.onpointerdown=e=>{y0=e.clientY;}; scr.onpointerup=e=>{ if(y0!==null && y0-e.clientY>50){ step=2; scr.setAttribute('fill','#BFE3FF'); w._t.innerHTML='😀 📷 🎨<br>🎵 ✏️ 🎮'; w._t.style.color='#2B2250'; good(); setTimeout(()=>done(!slipped),1300);} y0=null; }; };
  scr.onclick=()=>{ if(step===0){ slipped=true; bad(w.querySelector('svg')); say('Tap the power button first!'); } };
};

/* touch skills */
const tapStars=done=>{ clear(); setPrompt('👆','TAP the stars!'); say('Tap = touch quickly with one finger'); let n=0; stage.style.minHeight='320px';
  [[14,18],[60,52],[34,66]].forEach(([x,y])=>{ const s=mk('div','abs','⭐'); s.style.left=x+'%'; s.style.top=y+'%'; s.onclick=()=>{ if(s.classList.contains('pop'))return; s.classList.add('pop'); if(++n===3){ good(); setTimeout(()=>done(true),700);} }; stage.appendChild(s); }); };
const doubleTap=done=>{ clear(); setPrompt('👆👆','DOUBLE-TAP the balloon!'); say('Two quick taps, one after the other'); const b=mk('div','big','🎈'); b.style.cssText='font-size:150px;cursor:pointer'; stage.appendChild(b); let last=0, slipped=false;
  b.onclick=()=>{ const now=Date.now(); if(now-last<500){ b.classList.add('pop'); good(); setTimeout(()=>done(!slipped),700);} else { last=now; say('Tap again, quickly! 👆'); } }; };
const dragApple=done=>{ clear(); setPrompt('☝️➡️','DRAG the apple to the basket!'); say('Touch it, slide your finger, then let go'); stage.style.minHeight='320px';
  const bk=mk('div','basket','🧺'); stage.appendChild(bk); const ap=mk('div','drag','🍎'); ap.style.left='10%'; ap.style.top='24%'; stage.appendChild(ap);
  let ox=0,oy=0,drag=false,slipped=false; const sx='10%',sy='24%';
  ap.onpointerdown=e=>{ drag=true; ap.setPointerCapture(e.pointerId); const r=ap.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; };
  ap.onpointermove=e=>{ if(!drag)return; const s=stage.getBoundingClientRect(); ap.style.left=(e.clientX-s.left-ox)+'px'; ap.style.top=(e.clientY-s.top-oy)+'px'; };
  ap.onpointerup=e=>{ if(!drag)return; drag=false; const a=ap.getBoundingClientRect(), b=bk.getBoundingClientRect(); const cx=a.left+a.width/2, cy=a.top+a.height/2;
    if(cx>b.left&&cx<b.right&&cy>b.top-20&&cy<b.bottom){ ap.style.left=(b.left-stage.getBoundingClientRect().left+b.width/2-40)+'px'; ap.style.top=(b.top-stage.getBoundingClientRect().top+10)+'px'; good(); setTimeout(()=>done(!slipped),900);} else { slipped=true; ap.style.left=sx; ap.style.top=sy; say('Drag it all the way into the basket! 🧺'); } }; };
const drawTask=done=>{ clear(); setPrompt('✏️','DRAW with your finger!'); say('Draw a long wiggly line or a picture'); const c=mk('canvas'); c.id='draw'; stage.style.padding='8px'; stage.appendChild(c); c.width=c.clientWidth*2; c.height=520; const x=c.getContext('2d'); x.lineWidth=14; x.lineCap='round'; x.strokeStyle='#FF7F50';
  let dr=false,lx=0,ly=0,len=0,fin=false; const pos=e=>{const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly);x.stroke();};
  c.onpointermove=e=>{ if(!dr)return; const [px,py]=pos(e); x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke(); len+=Math.hypot(px-lx,py-ly); lx=px;ly=py; if(len>1400&&!fin){fin=true; good(); setTimeout(()=>done(true),900);} };
  c.onpointerup=()=>{dr=false;}; };

/* keyboard */
const ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
function buildKB(onKey,withBack,withDone){ const kb=mk('div','kb'); ROWS.forEach((r,i)=>{ const row=mk('div','kr'); [...r].forEach(ch=>{ const k=mk('button','key',ch); k.onclick=()=>onKey(ch); row.appendChild(k); }); if(i===2&&withBack){ const b=mk('button','key wide','⌫'); b.onclick=()=>onKey('BACK'); row.appendChild(b); } if(i===2&&withDone){ const d=mk('button','key go2','✔'); d.onclick=()=>onKey('DONE'); row.appendChild(d);} kb.appendChild(row); }); return kb; }
const typeWord=(e,word)=>done=>{ clear(); setPrompt(e,'Type the word: '+word); stage.style.minHeight='300px'; const slots=mk('div','slots'); stage.appendChild(slots); let i=0, slipped=false;
  const draw=()=>{ slots.innerHTML=''; [...word].forEach((ch,k)=>{ const s=mk('div','slot'+(k<i?'':' ghost'),ch); slots.appendChild(s); }); }; draw();
  const kb=buildKB(ch=>{ if(i>=word.length||ch==='BACK'||ch==='DONE')return; if(ch===word[i]){ i++; draw(); if(i===word.length){ good(); setTimeout(()=>done(!slipped),900);} } else { slipped=true; bad(slots); } },false,false); stage.appendChild(kb); say('Tap the letters on the keyboard'); };
const typeName=done=>{ clear(); setPrompt('⌨️','Type your name!'); const t=mk('div','typed',''); stage.appendChild(t); let s=''; const kb=buildKB(ch=>{ if(ch==='BACK'){ s=s.slice(0,-1);} else if(ch==='DONE'){ if(s.length>=2){ good(); setTimeout(()=>done(true),900);} else say('Type your name first! ⌨️'); return; } else if(s.length<12){ s+=ch; } t.textContent=s; },true,true); stage.appendChild(kb); say('Then tap the green ✔'); };
/* edit text */
const editTask=(e,start,target)=>done=>{ clear(); setPrompt(e,'Fix it to say: '+target); let txt=[...start], cur=txt.length, slipped=false; const line=mk('div','line'); stage.appendChild(line);
  const render=()=>{ line.innerHTML=''; for(let i=0;i<=txt.length;i++){ const g=mk('div','gap'+(i===cur?' cur':'')); g.onclick=()=>{cur=i;render();}; line.appendChild(g); if(i<txt.length) line.appendChild(mk('div','ch',txt[i])); } };
  render(); stage.appendChild(mk('div','hint','👆 Tap between letters to move the cursor, then use ⌫ to delete')); 
  const kb=buildKB(ch=>{ if(ch==='BACK'){ if(cur>0){ txt.splice(cur-1,1); cur--; } } else if(ch==='DONE'){return;} else if(txt.length<8){ txt.splice(cur,0,ch); cur++; } render();
    if(txt.join('')===target){ good(); [...kb.querySelectorAll('button')].forEach(b=>b.onclick=null); setTimeout(()=>done(!slipped),900);} },true,false); stage.appendChild(kb); };

/* ---------- levels ---------- */
const LEVELS=[
 {e:'🔎',name:'What is technology?',les:'Lesson 1',tasks:[
  sort2('📱','Tablet',true),sort2('🌳','Tree',false),sort2('🔦','Torch',true),
  pickTask('🕐','Which one helps us tell the time?',[{e:'⏰',ok:true},{e:'🌸'},{e:'🍎'}]),
  pickTask('📸','Which one helps us take photos?',[{e:'🪨'},{e:'📷',ok:true},{e:'🌳'}])]},
 {e:'📱',name:'Parts of the tablet',les:'Lesson 2',tasks:[
  partTask('📷','camera','cam'),partTask('🖥️','screen','scr'),partTask('🔊','speaker','spk'),partTask('⏻','power button','pwr'),switchOn]},
 {e:'👆',name:'Finger skills',les:'Lessons 2 + 3',tasks:[tapStars,doubleTap,dragApple,drawTask]},
 {e:'⌨️',name:'The on-screen keyboard',les:'Lesson 4',tasks:[
  typeWord('🐱','CAT'),typeWord('☀️','SUN'),typeName,
  pickTask('💾','Which picture means SAVE?',[{e:'📷'},{e:'💾',ok:true},{e:'🔒'}])]},
 {e:'✏️',name:'Fix my writing',les:'Lesson 5',tasks:[editTask('🐱','CAAT','CAT'),editTask('🐶','DAOG','DOG'),editTask('☀️','SUM','SUN')]},
 {e:'🛡️',name:'Using tablets safely',les:'Lesson 6',tasks:[
  pickTask('🤲','Hold the tablet with two hands',[{e:'✅',cls:'yes',ok:true,t:'Good rule'},{e:'❌',cls:'no',t:'Not a rule'}],'🧒📱'),
  pickTask('🥤','Have a drink next to the tablet',[{e:'✅',cls:'yes',t:'Good rule'},{e:'❌',cls:'no',ok:true,t:'Not a rule'}],'🥤📱'),
  pickTask('🏃','Run around with the tablet',[{e:'✅',cls:'yes',t:'Good rule'},{e:'❌',cls:'no',ok:true,t:'Not a rule'}],'🏃📱'),
  pickTask('🙋','Tell the teacher if you see something wrong',[{e:'✅',cls:'yes',ok:true,t:'Good rule'},{e:'❌',cls:'no',t:'Not a rule'}],'🙋‍♀️👩‍🏫'),
  pickTask('😴','Rest your eyes and take a break',[{e:'✅',cls:'yes',ok:true,t:'Good rule'},{e:'❌',cls:'no',t:'Not a rule'}],'😌👀')]}
];
totalTasks=LEVELS.reduce((a,l)=>a+l.tasks.length,0);
function renderPills(){ $('pills').innerHTML=LEVELS.map((l,i)=>`<div class="pill ${i<L?'done':i===L?'cur':''}">${i<L?'✔':l.e}</div>`).join(''); }
function renderStars(){ $('stars').textContent='⭐ × '+firstTry; $('barFill').style.width=(doneCount/totalTasks*100)+'%'; }
function intro(){ renderPills(); const l=LEVELS[L]; stage.style.minHeight='300px'; const ov=mk('div','overlay',`<div class="card"><div class="em">${l.e}</div><h2>Level ${L+1}: ${l.name}</h2><p>From ${l.les}</p><button class="go">Go! ▶</button></div>`); document.body.appendChild(ov); ov.querySelector('button').onclick=()=>{ov.remove(); T=0; nextTask();}; clear(); promptEl.innerHTML=''; }
function nextTask(){ stage.style.padding='14px'; stage.style.minHeight='300px'; const l=LEVELS[L]; if(T>=l.tasks.length){ L++; confetti(14); if(L>=LEVELS.length) return finish(); return setTimeout(intro,700); } l.tasks[T](ok=>{ doneCount++; if(ok)firstTry++; T++; renderStars(); nextTask(); }); }
function finish(){ renderPills(); renderStars(); const pct=Math.round(firstTry/totalTasks*100); confetti(40); clear(); promptEl.innerHTML=''; stage.innerHTML=`<div style="font-size:90px">🏆</div><div style="font-size:30px;font-weight:800;color:var(--primary);text-align:center;margin-top:6px">You are a Tablet Master!</div><div style="font-size:22px;margin-top:8px">⭐ ${firstTry} / ${totalTasks} first-try stars</div><button class="go" style="margin-top:18px;max-width:300px" onclick="location.reload()">Play again 🔁</button>`;
  if(window.__submitResultToCloud){ window.__submitResultToCloud({name:'Player',game:'Tablet Master Quest! (Y1 Revision)',score:pct,total:100,date:new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}); } }
$('startBtn').onclick=()=>{ $('gate').style.display='none'; const q=parseInt(new URLSearchParams(location.search).get('level')); if(q>=1&&q<=LEVELS.length) L=q-1; intro(); };
renderPills();
</script>
