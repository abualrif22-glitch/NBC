<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Typing Champions! - Year 2 Computing Game</title>
<style>
  :root{ --primary:#FF7F50; --secondary:#4FC3F7; --accent:#FFD54F; --green:#4CAF50; --light:#FFF9F0; --dark:#2B2250; --red:#E85C4A; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; min-height:100%; overscroll-behavior:none;}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif; background:linear-gradient(135deg,#FF7F50 0%,#FFD54F 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:14px; color:var(--dark);}
  .wrap{background:var(--light); border-radius:26px; max-width:720px; width:100%; padding:18px 22px 24px; box-shadow:0 20px 50px rgba(0,0,0,.3); position:relative; overflow:hidden;}
  .hub-top-btn{position:fixed; top:10px; left:10px; z-index:300; background:#1A1A2E; color:#fff; text-decoration:none; font-weight:bold; font-size:14px; padding:8px 16px 8px 12px; border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,.35);}
  h1{margin:6px 0 2px; text-align:center; color:var(--primary); font-size:clamp(24px,5vw,32px);}
  .pills{display:flex; gap:6px; justify-content:center; margin:8px 0 10px;}
  .pill{width:40px; height:40px; border-radius:50%; background:#EADFCB; display:flex; align-items:center; justify-content:center; font-size:20px; transition:.3s;}
  .pill.cur{background:var(--secondary); transform:scale(1.15); box-shadow:0 3px 8px rgba(0,0,0,.2);}
  .pill.done{background:var(--green);}
  .stars{text-align:center; font-size:22px; letter-spacing:2px; min-height:28px;}
  .bar{height:12px; background:#EADFCB; border-radius:8px; overflow:hidden; margin:6px 0 12px;}
  .bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .4s;}
  .prompt{display:flex; align-items:center; justify-content:center; gap:14px; background:#fff; border-radius:18px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:12px; min-height:84px;}
  .prompt .pe{font-size:56px; line-height:1;}
  .prompt .pt{font-size:clamp(20px,4vw,28px); font-weight:800; color:var(--dark);}
  .prompt:empty{display:none;}
  .stage{position:relative; background:#FFF0E0; border:4px dashed #FFD2B0; border-radius:24px; min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; touch-action:manipulation;}
  .big{font-size:110px; line-height:1; filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));}
  .row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px; width:100%;}
  .btn{flex:1; min-width:140px; max-width:300px; padding:16px 12px; border-radius:20px; border:5px solid transparent; font-size:22px; font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; background:#fff; color:var(--dark); box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .btn .ic{font-size:54px; line-height:1;}
  .btn:active{transform:translateY(3px); box-shadow:none;}
  .btn.yes{background:#E8F7E4; border-color:#8BC34A;}
  .btn.no{background:#FDE8E4; border-color:#F2998B;}
  .btn.ok{background:#C8F0C0; border-color:var(--green);}
  .btn.bad{animation:shake .4s; border-color:var(--red);}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shake{animation:shake .4s;}
  .msg{text-align:center; min-height:34px; margin:10px 0 0; font-size:22px; font-weight:800; color:var(--primary);}
  .overlay{position:fixed; inset:0; background:rgba(43,34,80,.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .card{background:#fff; border-radius:24px; padding:30px 30px; max-width:460px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .card h2{margin:6px 0 6px; color:var(--primary); font-size:28px;}
  .card p{color:#555; font-size:18px; margin:0 0 16px;}
  .card .em{font-size:84px; line-height:1;}
  .go{width:100%; padding:16px; border:none; border-radius:16px; background:var(--primary); color:#fff; font-size:22px; font-weight:800; cursor:pointer; box-shadow:0 5px 0 #d5603a;}
  .go:active{transform:translateY(4px); box-shadow:none;}
  /* tablet svg */
  svg.tab{width:min(300px,70%); height:auto; touch-action:manipulation;}
  .hot{cursor:pointer;}
  /* touch tasks */
  .abs{position:absolute; line-height:1; font-size:70px; cursor:pointer; transition:transform .15s;}
  .pop{animation:pop .35s forwards;}
  @keyframes pop{to{transform:scale(1.7); opacity:0;}}
  .basket{position:absolute; right:22px; bottom:22px; font-size:110px; line-height:1;}
  .drag{position:absolute; font-size:84px; line-height:1; touch-action:none; cursor:grab; z-index:5;}
  canvas#draw{background:#fff; border-radius:18px; touch-action:none; width:100%; height:260px; border:3px solid #FFD2B0;}
  /* keyboard */
  .slots{display:flex; gap:10px; justify-content:center; margin:6px 0 10px; flex-wrap:wrap;}
  .slot{width:62px; height:76px; border-radius:14px; border:4px solid #FFD2B0; background:#fff; font-size:46px; font-weight:800; display:flex; align-items:center; justify-content:center; color:var(--dark);}
  .slot.ghost{color:#E6D9C2;}
  .kb{background:#2F3140; border-radius:18px; padding:8px; width:100%; max-width:660px; margin-top:8px;}
  .kr{display:flex; gap:5px; justify-content:center; margin-bottom:5px;}
  .key{flex:1; max-width:56px; height:52px; border-radius:9px; border:none; background:#555a70; color:#fff; font-size:22px; font-weight:700; cursor:pointer;}
  .key:active{background:#7a80a0;}
  .key.wide{max-width:110px; background:#6d7390; font-size:20px;}
  .key.go2{background:var(--green); max-width:110px;}
  .typed{min-height:76px; min-width:240px; background:#fff; border:4px solid var(--secondary); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:800; padding:0 14px; letter-spacing:4px;}
  /* edit cursor */
  .line{display:flex; align-items:center; justify-content:center; min-height:90px; background:#fff; border:4px solid var(--secondary); border-radius:14px; padding:6px 10px;}
  .ch{font-size:50px; font-weight:800; padding:0 4px; line-height:1.2;}
  .gap{width:26px; height:76px; border-radius:6px; cursor:pointer; position:relative;}
  .gap.cur::after{content:''; position:absolute; left:11px; top:8px; bottom:8px; width:5px; background:var(--primary); animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .hint{font-size:17px; color:#8a7766; text-align:center; margin-top:6px; font-weight:600;}
  .key.hint{background:#FFD54F;color:#2B2250;box-shadow:0 0 0 3px #fff inset;}
  .dot{position:absolute; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:#4FC3F7; color:#fff; font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center; border:4px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .dot.hit{background:#4CAF50;}
  .dot.next{animation:pulse .9s infinite;}
  @keyframes pulse{50%{transform:scale(1.18);}}
  .bin{position:absolute; bottom:12px; width:36%; height:110px; border:5px dashed #B9B3D6; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:64px; background:rgba(255,255,255,.7);}
  .hole{position:absolute; font-size:76px; line-height:1; opacity:.28; filter:grayscale(1);}
  .num{position:absolute; width:78px; height:78px; margin:-39px 0 0 -39px; border-radius:50%; color:#fff; font-size:44px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.2);}
  .key.on{background:#FFB300;color:#2B2250;}
  .key.spc{max-width:300px;flex:3;}
  .tbox{width:100%; max-width:660px; background:#fff; border:4px solid var(--secondary); border-radius:16px; padding:14px 12px; margin-bottom:6px; min-height:84px; display:flex; align-items:center; justify-content:center;}
  .tline{display:flex; flex-wrap:wrap; justify-content:center; gap:0; font-size:clamp(28px,5.5vw,40px); font-weight:700; line-height:1.4;}
  .tc{min-width:.5em; text-align:center; border-bottom:4px solid transparent;}
  .tc.grey{color:#C9BFAE;} .tc.ok{color:#2E9E5B;} .tc.no{color:#E85C4A; background:#FDE8E4; border-radius:6px;}
  .tc.cur{border-bottom-color:var(--primary);}
  .tc.blank{color:#B9B3D6;}
  .eline{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; background:#fff; border:4px solid var(--secondary); border-radius:14px; padding:10px 12px; font-size:clamp(26px,5vw,36px); font-weight:700; width:100%; max-width:660px; min-height:80px;}
  .ec{display:inline-block; width:0; height:1.3em; position:relative;} .ec.cur::after,.ec3.cur::after{content:''; position:absolute; top:2px; bottom:2px; width:4px; background:var(--primary); animation:blink 1s steps(1) infinite;} .ec3{position:relative; display:inline-block; width:1.5em; height:1.3em;} .ec3.cur::after{left:0;}
  .ec2{display:inline-block; min-width:.45em; padding:6px 1px; text-align:center; cursor:pointer;}
  @keyframes blink{50%{opacity:0}}
  .conf{position:fixed; top:-20px; font-size:28px; z-index:400; pointer-events:none; animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
  .lock{position:relative;}
</style>
</head>
<body>
<a class="hub-top-btn" href="index.html">🏠 Back to Hub</a>
<div class="overlay" id="gate"><div class="card">
  <div class="em">⌨️🏆</div>
  <h2>Typing Champions!</h2>
  <p>A tricky typing challenge for Year 2. Capitals, sentences and speed!</p>
  <button class="go" id="startBtn">Tap to Start! ▶</button>
</div></div>

<div class="wrap" id="wrap">
  <h1>⌨️ Typing Champions! ⌨️</h1>
  <div class="pills" id="pills"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="stars" id="stars"></div>
  <div class="prompt" id="prompt"></div>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), promptEl=$('prompt'), msgEl=$('msg');
let SEQ=0, L=0, T=0, firstTry=0, totalTasks=0, doneCount=0, keyCb=null, shiftOn=false, timerId=null, bestWords=0;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function say(t){ msgEl.textContent=t||''; }
function setPrompt(e,t){ promptEl.innerHTML=`<span class="pe">${e}</span><span class="pt">${t}</span>`; }
function clear(){ if(timerId){clearInterval(timerId);timerId=null;} stage.innerHTML=''; stage.dataset.kind=''; stage.dataset.seq=++SEQ; stage.dataset.target=''; keyCb=null; shiftOn=false; say(''); }
function mk(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function shake(el){ if(!el)return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function good(){ say(['Well done! ⭐','Super typing! 🌟','Yes! 🎉','Brilliant! ✨','Great job! 👏'][Math.floor(Math.random()*5)]); }
function confetti(n){ const E=['🎉','⭐','🌟','🎈','✨']; for(let i=0;i<n;i++){ const c=mk('div','conf',E[i%E.length]); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*.8)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200);} }

/* keyboard: lowercase, shift, space, punctuation */
const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
function buildKB(onKey,o={}){ const kb=mk('div','kb'); const keys=[];
  const mkKey=(label,val,cls)=>{ const k=mk('button','key '+(cls||''),label); k.dataset.k=val; k.onclick=()=>press(val); keys.push(k); return k; };
  const press=v=>{ if(v==='SHIFT'){ shiftOn=!shiftOn; refresh(); return; } let out=v; if(v.length===1&&/[a-z]/.test(v)&&shiftOn){ out=v.toUpperCase(); } if(v.length===1&&shiftOn){ shiftOn=false; refresh(); } onKey(out); };
  const refresh=()=>{ keys.forEach(k=>{ const v=k.dataset.k; if(v.length===1&&/[a-z]/.test(v)) k.textContent=shiftOn?v.toUpperCase():v; if(v==='SHIFT') k.classList.toggle('on',shiftOn); }); };
  ROWS.forEach((r,i)=>{ const row=mk('div','kr'); if(i===2) row.appendChild(mkKey('⇧','SHIFT','wide')); [...r].forEach(ch=>row.appendChild(mkKey(ch,ch))); if(i===2) row.appendChild(mkKey('⌫','BACK','wide')); kb.appendChild(row); });
  const br=mk('div','kr'); br.appendChild(mkKey(',',',')); const sp=mkKey('space',' ','spc'); br.appendChild(sp); br.appendChild(mkKey('.','.')); br.appendChild(mkKey('?','?')); br.appendChild(mkKey('!','!')); if(o.done) br.appendChild(mkKey('✔','DONE','go2')); kb.appendChild(br);
  keyCb=onKey; kb._refresh=refresh; return kb; }
document.addEventListener('keydown',e=>{ if(!keyCb||e.ctrlKey||e.metaKey)return; let k=null; if(e.key.length===1)k=e.key; else if(e.key==='Backspace')k='BACK'; else if(e.key==='Enter')k='DONE'; if(k){ e.preventDefault(); keyCb(k);} });
function hintKey(kb,ch){ kb.querySelectorAll('.key.hint').forEach(k=>k.classList.remove('hint')); if(!ch)return; const lower=ch.toLowerCase(); const need=(ch!==lower&&/[A-Z]/.test(ch)); const k=kb.querySelector(`.key[data-k="${need?'SHIFT':lower}"]`); if(k)k.classList.add('hint'); }

/* typing a target line: shows target, colours typed chars */
function lineView(target,typed,hide){ const w=mk('div','tline'); [...target].forEach((c,i)=>{ const s=mk('span','tc'); const t=typed[i];
  if(t===undefined){ s.textContent=hide?'_':(c===' '?' ':c); s.className='tc '+(i===typed.length?'cur ':'')+(hide?'blank':'grey'); }
  else { s.textContent=t===' '?' ':t; s.className='tc '+(t===c?'ok':'no'); } w.appendChild(s); });
  if(typed.length>target.length) w.appendChild(mk('span','tc no','…')); return w; }
const typeLine=(pe,txt,target,o={})=>done=>{ clear(); stage.dataset.kind='type'; stage.dataset.target=target; setPrompt(pe,txt); let typed='', slipped=false, peeked=false;
  const box=mk('div','tbox'); stage.appendChild(box); const render=()=>{ box.innerHTML=''; box.appendChild(lineView(target,typed,o.hide&&!peeked)); };
  render(); let kb; const finish=()=>{ good(); keyCb=null; setTimeout(()=>done(!slipped),900); };
  kb=buildKB(ch=>{ if(ch==='DONE')return; if(ch==='BACK'){ typed=typed.slice(0,-1); } else if(ch.length===1&&typed.length<target.length+3){ if(typed.length<target.length&&ch!==target[typed.length]){ slipped=true; shake(box); if(o.hint) hintKey(kb,target[typed.length]); } typed+=ch; } render(); hintKey(kb,null); if(typed===target) finish(); else if(slipped&&typed.length<target.length&&typed===target.slice(0,typed.length)&&o.hint) hintKey(kb,target[typed.length]); },{});
  stage.appendChild(kb); say(o.say||'Type it exactly: capital letters, spaces and full stops matter!');
  if(o.hide){ const pk=mk('button','go','Peek 👀'); pk.style.cssText='max-width:180px;margin-top:8px;padding:10px;font-size:18px'; pk.onclick=()=>{ peeked=true; slipped=true; render(); setTimeout(()=>{peeked=false;render();},1800); }; stage.insertBefore(pk,kb); } };

/* edit text: tap a character to place the cursor, backspace to delete, type to insert */
const editLine=(pe,start,target)=>done=>{ clear(); stage.dataset.kind='edit'; stage.dataset.target=target; setPrompt(pe,'Fix the mistake!'); let txt=[...start], cur=txt.length, slipped=false;
  const tgt=mk('div','hint','Goal: '+target); tgt.style.cssText='font-size:22px;font-weight:700;color:#2B2250;margin:0 0 8px;text-align:center'; stage.appendChild(tgt);
  const line=mk('div','eline'); stage.appendChild(line);
  const render=()=>{ line.innerHTML=''; txt.forEach((c,i)=>{ const left=mk('span','ec'+(i===cur?' cur':''),''); const s=mk('span','ec2',c===' '?' ':c); s.dataset.i=i; s.onclick=e=>{ const r=s.getBoundingClientRect(); cur=(e.clientX-r.left<r.width/2)?i:i+1; render(); }; line.appendChild(s); }); const end=mk('span','ec3'+(cur===txt.length?' cur':''),' '); end.onclick=()=>{cur=txt.length;render();}; line.appendChild(end); };
  render(); stage.appendChild(mk('div','hint','👆 Tap a letter to move the cursor · ⌫ deletes the letter before the cursor'));
  const kb=buildKB(ch=>{ if(ch==='BACK'){ if(cur>0){ txt.splice(cur-1,1); cur--; } } else if(ch==='DONE'){return;} else if(txt.length<60){ txt.splice(cur,0,ch); cur++; } render();
    if(txt.join('')===target){ good(); keyCb=null; setTimeout(()=>done(!slipped),900);} },{}); stage.appendChild(kb); };

/* beat the clock */
const WORDS=['tiger','happy','green','apple','plane','cloud','robot','pizza','smile','water','table','music','horse','snake','beach','chair','bread','light','river','sunny','house','night','dream','funny','storm'];
const clockTask=(secs)=>done=>{ clear(); stage.dataset.kind='clock'; setPrompt('⏱️','Beat the clock! Type as many words as you can'); let words=shuf(WORDS), wi=0, typed='', score=0, left=secs, started=false;
  const info=mk('div','',''); info.style.cssText='font-size:26px;font-weight:800;margin-bottom:8px;display:flex;gap:24px;justify-content:center'; const tm=mk('span','',''), sc=mk('span','',''); info.append(tm,sc); stage.appendChild(info);
  const box=mk('div','tbox'); stage.appendChild(box); const upd=()=>{ tm.textContent='⏱️ '+left+'s'; sc.textContent='⭐ '+score+' words'; box.innerHTML=''; box.appendChild(lineView(words[wi%words.length],typed,false)); };
  upd(); let ended=false; const end=()=>{ ended=true; clearInterval(timerId); timerId=null; keyCb=null; bestWords=Math.max(bestWords,score); box.innerHTML='<div style="font-size:30px;font-weight:800;text-align:center">⏰ Time is up!<br>You typed '+score+' words 🎉</div>'; say(score>=8?'Amazing typing! 🏆':score>=5?'Great speed! ⭐':'Good try! Practise makes faster! 💪'); stage.dataset.score=score; setTimeout(()=>done(score>=6),2600); };
  const kb=buildKB(ch=>{ if(ended||ch==='DONE')return; if(!started){ started=true; timerId=setInterval(()=>{ left--; upd(); if(left<=0)end(); },1000); } const w=words[wi%words.length]; if(ch==='BACK'){ typed=typed.slice(0,-1); } else if(ch.length===1){ if(ch===w[typed.length]){ typed+=ch; } else { shake(box); } } if(typed===w){ score++; wi++; typed=''; } upd(); },{}); stage.appendChild(kb); say('The clock starts when you type your first letter'); };

/* levels */
const L1=[['🐘','elephant'],['🚀','rocket'],['🍕','pizza'],['☁️','cloud'],['🐴','horse'],['🐍','snake']];
const L2=['Sam','Cyprus','Monday','London','Necat','Friday'];
const L3=['The cat sat on the mat.','I like to play games.','We are in Year 2.','Can you see the moon?','My dog is called Max.'];
const L5=[['🐘','elephant'],['🚀','rocket'],['🍌','banana'],['🌈','rainbow'],['🦒','giraffe'],['🐢','turtle']];
const LEVELS=[
 {e:'⌨️',name:'Warm-up words',les:'Type each word. Letters turn green when right!',tasks:L1.map(w=>typeLine(w[0],'Type the word',w[1],{hint:true}))},
 {e:'⇧',name:'Capital letters',les:'Use the ⇧ Shift key for a capital letter',tasks:L2.map(w=>typeLine('🔠','Type with a capital letter',w,{hint:true}))},
 {e:'📝',name:'Sentences',les:'Capital letter, spaces and full stop!',tasks:L3.map(s=>typeLine('📝','Type the sentence',s,{hint:true}))},
 {e:'⌫',name:'Fix my writing',les:'Move the cursor, delete and retype',tasks:[editLine('🐱','The catt sat on the mat.','The cat sat on the mat.'),editLine('📖','I lke to read books.','I like to read books.'),editLine('🏫','we are in Year 2.','We are in Year 2.'),editLine('🌙','Can you see the moon','Can you see the moon?')]},
 {e:'🖼️',name:'Spell it!',les:'Look at the picture and spell the word from memory',tasks:L5.map(w=>typeLine(w[0],'Spell the word',w[1],{hide:true,say:'Spell it! Stuck? Tap Peek 👀'}))},
 {e:'⏱️',name:'Beat the clock!',les:'60 seconds. How many words can you type?',tasks:[clockTask(60)]}
];
totalTasks=LEVELS.reduce((a,l)=>a+l.tasks.length,0);
function renderPills(){ $('pills').innerHTML=LEVELS.map((l,i)=>`<div class="pill ${i<L?'done':i===L?'cur':''}">${i<L?'✔':(i+1)}</div>`).join(''); }
function renderStars(){ $('stars').textContent='⭐ × '+firstTry; $('barFill').style.width=(doneCount/totalTasks*100)+'%'; }
function intro(){ renderPills(); const l=LEVELS[L]; clear(); promptEl.innerHTML=''; const ov=mk('div','overlay',`<div class="card"><div class="em">${l.e}</div><h2>Level ${L+1}: ${l.name}</h2><p>${l.les}</p><button class="go">Go! ▶</button></div>`); document.body.appendChild(ov); ov.querySelector('button').onclick=()=>{ov.remove(); T=0; nextTask();}; }
function nextTask(){ const l=LEVELS[L]; if(T>=l.tasks.length){ L++; confetti(14); if(L>=LEVELS.length) return finish(); return setTimeout(intro,700); } l.tasks[T](ok=>{ doneCount++; if(ok)firstTry++; T++; renderStars(); nextTask(); }); }
function finish(){ renderPills(); renderStars(); const pct=Math.round(firstTry/totalTasks*100); confetti(40); clear(); promptEl.innerHTML=''; stage.innerHTML=`<div style="font-size:90px">🏆</div><div style="font-size:30px;font-weight:800;color:var(--primary);text-align:center;margin-top:6px">Typing Champion!</div><div style="font-size:22px;margin-top:8px">⭐ ${firstTry} / ${totalTasks} first-try stars</div><div style="font-size:20px;margin-top:6px">⏱️ Fastest minute: ${bestWords} words</div><button class="go" style="margin-top:18px;max-width:300px" onclick="location.reload()">Play again 🔁</button>`;
  if(window.__submitResultToCloud){ window.__submitResultToCloud({name:'Player',game:'Typing Champions! (Y2)',score:pct,total:100,date:new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}); } }
$('startBtn').onclick=()=>{ $('gate').style.display='none'; const q=parseInt(new URLSearchParams(location.search).get('level')); if(q>=1&&q<=LEVELS.length) L=q-1; intro(); };
renderPills();
